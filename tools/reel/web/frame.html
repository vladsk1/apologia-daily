<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apologia frame reel</title>
<!--
  frame.html — the "one idea, one picture" reel template for Apologia Daily (format: "framereel").

  A reel is built around ONE central FIGURE that stays on screen and changes beat by beat while
  a short, large HEADLINE above it and the narration walk the viewer through it. The whole frame
  is used: headline · figure · source note, vertically centred in the Instagram-safe area.

  Driven two ways (same as web/reel.html):
    • Live preview:  open this file and press Play (silent, estimated timing).  #t=12000 seeks.
    • MP4 capture:   gen_framereel.py injects window.__SPEC + window.__TIMINGS, then
                     capture-webreel.mjs steps window.__seek(tMs) frame by frame.

  ALL motion is a pure function of time t (ms) — no CSS animations, no rAF state — so a captured
  frame at t is identical on every run.

  Spec (see README-framereel.md):
    { format:"framereel", scenes:[ { figure?:{type,…}, beats:[ {say, head, sub?, kick?, note?, show?, hold?} ] } ],
      end:{line, say}, caption_ig, caption_x, reviewed }
    head/sub/labels take inline colour:  *gold*  and  ~sky~ .  A beat that omits head/note keeps the previous one.
    `show` is the figure's state for that beat; it is merged over the previous beat's state.

  Figure types:  grid · number · bars · steps · timeline · ring · verse · scroll · scale · map · stack · hand · phone   (a scene with no figure = a statement)
  NO Trinity diagram is implemented here and none may be added (owner ruling 2026-08-29, CLAUDE.md).
-->
<style>
  :root{
    --navy:#0a1628; --navy2:#0f2040; --navy3:#13284d; --blue:#1c3a6e;
    --gold:#c8a951; --gold-l:#e6c975; --gold-d:#a88930;
    --sky:#9fc3e8; --cream:#faeeda; --dim:#c4bcad;
    --serif:Georgia, "Times New Roman", serif;
    --sans:Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:#000; overflow:hidden}
  #stage{position:absolute; top:0; left:0; width:1080px; height:1920px; overflow:hidden;
    background:radial-gradient(120% 75% at 50% 6%, var(--navy2) 0%, var(--navy) 44%, #04080f 100%);
    font-family:var(--serif); color:var(--cream)}

  /* ---- background: identical to web/reel.html (the owner's preferred navy starfield) ---- */
  .aurora b{position:absolute; border-radius:50%; filter:blur(150px); mix-blend-mode:screen; will-change:transform}
  .aurora .a1{width:620px; height:620px; left:-60px; top:150px; background:radial-gradient(circle, var(--blue), transparent 68%)}
  .aurora .a2{width:600px; height:600px; right:-80px; top:620px; background:radial-gradient(circle, rgba(200,169,81,.5), transparent 66%)}
  .aurora .a3{width:720px; height:720px; left:120px; bottom:-120px; background:radial-gradient(circle, var(--navy3), transparent 70%)}
  #sky{position:absolute; inset:0; width:1080px; height:1920px}
  .bloom{position:absolute; left:50%; top:30%; width:760px; height:760px; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(200,169,81,.55) 0%, transparent 62%); filter:blur(40px)}
  .sweep{position:absolute; top:-30%; width:360px; height:160%;
    background:linear-gradient(90deg, transparent, rgba(230,201,117,.10), transparent); transform:rotate(13deg)}
  .horizon{position:absolute; left:50%; bottom:-360px; width:1800px; height:900px; transform:translateX(-50%);
    background:radial-gradient(ellipse at center top, rgba(200,169,81,.22), rgba(28,58,110,.16) 42%, transparent 64%); filter:blur(24px)}

  /* ---- scene scaffolding ---- */
  .scene{position:absolute; inset:0; will-change:opacity}
  .zh{position:absolute; left:80px; width:920px}                    /* headline zone */
  .hseg{position:absolute; left:0; right:0; bottom:0; text-align:center; will-change:opacity,transform,filter}
  .scene.say .hseg{bottom:auto; top:50%}
  .scene.say .zh{left:110px; width:860px}
  .hl{display:block}
  .w{display:inline-block; will-change:opacity,transform,filter}
  .sdiv{width:300px; height:2px; margin:0 auto 34px; transform-origin:50% 50%;
    background:linear-gradient(90deg, rgba(200,169,81,0), rgba(230,201,117,.9) 50%, rgba(200,169,81,0))}
  .scene.say .kick{margin-bottom:22px}
  .kick{font-family:var(--sans); text-transform:uppercase; letter-spacing:.24em; text-indent:.24em; font-size:28px; color:var(--gold); margin-bottom:28px}
  .head{font-weight:400; line-height:1.14; color:var(--cream); text-wrap:balance; text-shadow:0 2px 26px rgba(4,8,15,.7)}
  .sub{font-size:46px; line-height:1.26; color:#d9d2c3; margin-top:26px; text-wrap:balance}
  .scene.say .sub{font-size:52px; margin-top:38px}
  .cite{font-family:var(--sans); text-transform:uppercase; letter-spacing:.2em; text-indent:.2em; font-size:27px; color:var(--dim); margin-top:44px}
  .g{color:var(--gold-l); text-shadow:0 0 44px rgba(200,169,81,.5)}
  .s{color:var(--sky); text-shadow:0 0 44px rgba(159,195,232,.45)}
  .fig{position:absolute; left:80px; width:920px; will-change:opacity,transform}
  .zn{position:absolute; left:80px; width:920px; height:44px}       /* source-note zone */
  .nseg{position:absolute; inset:0; text-align:center; font-family:var(--sans); text-transform:uppercase;
    letter-spacing:.2em; text-indent:.2em; font-size:27px; line-height:44px; color:var(--dim); white-space:nowrap}

  /* ---- readout (big number(s) + label) ---- */
  .ro{position:absolute; left:0; right:0; top:0; display:flex; justify-content:center; align-items:flex-start; gap:40px; transform-origin:50% 0}
  .ro-item{display:flex; flex-direction:column; align-items:center; will-change:opacity}
  .ro-num{font-weight:600; font-size:168px; line-height:1; white-space:nowrap}
  .ro.two .ro-num{font-size:128px}
  .ro.big .ro-num{font-size:270px}
  .ro.big.two .ro-num{font-size:200px}
  .ro-lab{font-family:var(--sans); text-transform:uppercase; letter-spacing:.16em; text-indent:.16em; font-size:28px; line-height:1.32;
    color:var(--dim); margin-top:18px; max-width:430px; text-align:center}
  .ro.big .ro-lab{font-size:32px; margin-top:26px; max-width:760px}
  .ro.big.two .ro-lab{max-width:400px; font-size:28px}
  .ro-op{font-weight:400; font-size:84px; line-height:128px; color:var(--cream); will-change:opacity}
  .ro.big.two .ro-op{line-height:200px}
  .c-gold{color:var(--gold-l); text-shadow:0 0 70px rgba(200,169,81,.55)}
  .c-sky{color:var(--sky); text-shadow:0 0 70px rgba(159,195,232,.5)}
  .c-cream{color:var(--cream)}
  .ro-num.tower{margin-top:74px}
  .ro-num sup.tw{font-size:.5em; line-height:1; vertical-align:baseline; position:relative; top:-.95em; margin-left:.05em; display:inline-block; transform-origin:0 100%; will-change:opacity,transform}
  .zrows{position:absolute; left:50%; width:860px; transform:translateX(-50%); overflow:hidden; will-change:opacity;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 34%, #000 100%); mask-image:linear-gradient(180deg, transparent 0, #000 34%, #000 100%)}
  .zin{position:absolute; left:0; right:0; top:0; will-change:transform}
  .zrow{font-family:var(--sans); font-weight:500; font-size:36px; letter-spacing:.14em; white-space:pre; text-align:left; color:rgba(230,201,117,.62)}
  .zrow .zhead{color:#fff6dc; text-shadow:0 0 18px rgba(244,220,150,.95), 0 0 44px rgba(200,169,81,.7)}
  .numglow{position:absolute; left:50%; top:130px; width:760px; height:420px; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(200,169,81,.22), transparent 64%); filter:blur(30px)}

  /* ---- bars ---- */
  .bars{position:absolute; left:0; right:0; top:0}
  .brow{padding-bottom:76px; will-change:opacity,transform}
  .brow:last-child{padding-bottom:0}
  .btop{display:flex; justify-content:space-between; align-items:flex-end; gap:30px; margin-bottom:24px}
  .blab{font-family:var(--sans); text-transform:uppercase; letter-spacing:.14em; font-size:35px; line-height:1.28; color:var(--cream); padding-bottom:14px}
  .bval{font-weight:600; font-size:124px; line-height:.95; white-space:nowrap}
  .btrack{height:28px; border-radius:14px; background:rgba(120,140,170,.16)}
  .bfill{height:100%; border-radius:14px; width:0}
  .bfill.gold{background:linear-gradient(90deg, var(--gold-d), var(--gold-l)); box-shadow:0 0 30px rgba(230,201,117,.55)}
  .bfill.sky{background:linear-gradient(90deg, rgba(159,195,232,.55), var(--sky)); box-shadow:0 0 30px rgba(159,195,232,.5)}

  /* ---- steps ---- */
  .steps{position:absolute; left:50%; top:0; transform:translateX(-50%); width:max-content; max-width:900px; display:flex; flex-direction:column; gap:46px; font-size:80px}
  .srow{display:flex; align-items:center; gap:34px; transform-origin:0 50%; will-change:opacity,transform}
  .smark{flex:none; width:1.3em; height:1.3em; border-radius:50%; border:2px solid rgba(200,169,81,.6);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.58em; color:var(--gold-l);
    background:radial-gradient(circle at 50% 34%, rgba(200,169,81,.22), rgba(200,169,81,.04))}
  .stext{min-width:0}
  .st{line-height:1.14}
  .ssub{font-size:.52em; line-height:1.3; color:var(--dim); margin-top:8px}

  /* ---- timeline (vertical: earliest at the top) ---- */
  .taxis{position:absolute; width:3px; top:0; transform-origin:50% 0;
    background:linear-gradient(rgba(200,169,81,0), rgba(200,169,81,.6) 9%, rgba(200,169,81,.6) 91%, rgba(200,169,81,0))}
  .tdot{position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:#3b4a66; will-change:transform}
  .tpt{position:absolute; transform:translateY(-50%); font-size:68px; will-change:opacity,transform}   /* children are sized in em, so a crowded timeline can shrink its labels together */
  .tyr{font-family:var(--sans); text-transform:uppercase; letter-spacing:.18em; font-size:.44em; color:var(--gold); margin-bottom:.15em; white-space:nowrap}
  .tlab{font-size:1em; line-height:1.1; white-space:nowrap}
  .tsub{font-size:.53em; line-height:1.28; color:var(--dim); margin-top:.15em}
  .tspan{position:absolute; width:5px; border-radius:3px; background:var(--gold-l); box-shadow:0 0 26px rgba(230,201,117,.85)}
  .tspan::before,.tspan::after{content:""; position:absolute; left:-10px; width:25px; height:5px; border-radius:3px; background:var(--gold-l)}
  .tspan::before{top:0} .tspan::after{bottom:0}
  .tspan.sky{background:var(--sky); box-shadow:0 0 26px rgba(159,195,232,.8)}
  .tspan.sky::before,.tspan.sky::after{background:var(--sky)}
  .tsl{position:absolute; left:0; text-align:right; transform:translateY(-50%); will-change:opacity}
  .tsn{font-weight:600; font-size:124px; line-height:1; white-space:nowrap}
  .tsu{font-family:var(--sans); text-transform:uppercase; letter-spacing:.16em; font-size:27px; line-height:1.3; color:var(--dim); margin-top:10px}

  /* ---- ring (many → one) ---- */
  .rsvg{position:absolute; left:0; top:0; overflow:visible}
  .rnode{position:absolute; width:0; height:0}
  .rdot{position:absolute; left:-11px; top:-11px; width:22px; height:22px; border-radius:50%; background:#3b4a66}
  .rlab{position:absolute; left:0; transform:translateX(-50%); width:320px; text-align:center; will-change:opacity}
  .rlab.up{bottom:26px} .rlab.dn{top:26px}
  .rt{font-size:52px; line-height:1.1}
  .rs{font-family:var(--sans); text-transform:uppercase; letter-spacing:.12em; font-size:26px; line-height:1.3; color:var(--dim); margin-top:6px}
  .rcglow{position:absolute; width:520px; height:520px; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(230,201,117,.42), transparent 62%); filter:blur(26px)}
  .rcenter{position:absolute; width:380px; transform:translate(-50%,-50%); text-align:center; font-size:66px; line-height:1.12; font-weight:600; will-change:opacity,transform}
  .rseed{position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; border:2px solid rgba(200,169,81,.55)}

  /* ---- verse (the words themselves are the picture) ---- */
  .verse{position:absolute; left:10px; right:10px; top:0; text-align:center; font-style:italic; line-height:1.3; text-wrap:balance}
  .verse .w{display:inline-block; will-change:opacity,transform}
  .vcite{position:absolute; left:0; right:0; text-align:center; font-family:var(--sans); text-transform:uppercase; letter-spacing:.2em; text-indent:.2em; font-size:28px; color:var(--gold)}

  /* ---- scroll (a manuscript leaf: lines write themselves, the key line lights) ---- */
  .scr{position:absolute; left:50%; top:0; transform:translateX(-50%)}
  .scr-rod{position:relative; height:24px; border-radius:12px; margin:0 -30px; background:linear-gradient(180deg,#f0d98f,#b3923a 55%,#6f5a1f); box-shadow:0 0 34px rgba(200,169,81,.4)}
  .scr-body{overflow:hidden; padding:34px 54px 22px; background:linear-gradient(180deg, rgba(27,42,70,.96), rgba(17,30,54,.96));
    border-left:2px solid rgba(200,169,81,.42); border-right:2px solid rgba(200,169,81,.42)}
  .scr-title{font-family:var(--sans); text-transform:uppercase; letter-spacing:.2em; text-indent:.2em; font-size:26px; color:var(--gold); text-align:center; margin-bottom:24px}
  .scr-row{position:relative; display:flex; gap:16px; align-items:center; height:30px; margin-bottom:24px; color:var(--cream); will-change:opacity}
  .scr-row.txt{display:block; height:auto; font-style:italic; line-height:1.2; margin-bottom:.3em; text-align:center}
  .scr-dash{display:block; height:8px; border-radius:4px; background:currentColor; opacity:.62}
  .scr-mark{position:absolute; left:-38px; top:50%; width:13px; height:13px; margin-top:-7px; transform:rotate(45deg); background:var(--gold-l); box-shadow:0 0 18px var(--gold)}
  .scr-cite{position:absolute; left:0; right:0; text-align:center; font-family:var(--sans); text-transform:uppercase; letter-spacing:.2em; text-indent:.2em; font-size:27px; color:var(--gold)}

  /* ---- scale (a balance: chips drop onto the pans and the beam answers) ---- */
  .sc-post{position:absolute; width:6px; border-radius:3px; background:linear-gradient(180deg,#e6c975,#7d6724)}
  .sc-base{position:absolute; width:240px; height:12px; border-radius:6px; background:linear-gradient(90deg, rgba(200,169,81,.15), #c8a951, rgba(200,169,81,.15))}
  .sc-beam{position:absolute; height:8px; border-radius:4px; transform-origin:50% 50%; background:linear-gradient(90deg,#9fc3e8,#e6c975 55%); box-shadow:0 0 26px rgba(230,201,117,.4); will-change:transform}
  .sc-piv{position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:#e6c975; box-shadow:0 0 30px rgba(230,201,117,.8)}
  .sc-pan{position:absolute; left:0; top:0; width:0; height:0; will-change:transform}
  .sc-pan.gold{color:var(--gold-l)} .sc-pan.sky{color:var(--sky)}
  .sc-str{position:absolute; left:-130px; top:0; overflow:visible}
  .sc-plate{position:absolute; left:-150px; width:300px; height:10px; border-radius:5px; background:currentColor; box-shadow:0 0 22px currentColor}
  .sc-lab{position:absolute; left:-190px; width:380px; text-align:center; font-family:var(--sans); text-transform:uppercase; letter-spacing:.16em; text-indent:.16em; font-size:31px; line-height:1.3}
  .sc-chip{position:absolute; left:-140px; width:280px; height:70px; border-radius:14px; border:2px solid currentColor; background:rgba(8,18,34,.88);
    display:flex; align-items:center; justify-content:center; font-size:38px; white-space:nowrap; overflow:hidden; will-change:transform,opacity}
  .sc-chip span{color:var(--cream)}

  /* ---- map (places in their true relative positions; routes arc between them) ---- */
  .mp-svg{position:absolute; left:0; top:0; overflow:visible}
  .mp-dot{position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:#3b4a66; will-change:transform}
  .mp-lab{position:absolute; white-space:nowrap; will-change:opacity}
  .mp-t{font-size:50px; line-height:1.08}
  .mp-s{font-family:var(--sans); text-transform:uppercase; letter-spacing:.12em; font-size:23px; line-height:1.3; color:var(--dim); margin-top:5px}
  .mp-bar{position:absolute; left:6px; height:8px; border:2px solid rgba(196,188,173,.55); border-top:none}
  .mp-km{position:absolute; left:6px; font-family:var(--sans); letter-spacing:.14em; font-size:22px; color:var(--dim)}
  .mp-n{position:absolute; right:10px; top:0; font-family:var(--sans); font-size:22px; letter-spacing:.1em; color:var(--dim); text-align:center; line-height:1.1}

  /* ---- stack (evidence that builds, slab on slab, to a capstone) ---- */
  .stk{position:absolute; border-radius:16px; border:2px solid rgba(200,169,81,.55); display:flex; align-items:center; justify-content:center; gap:22px;
    background:linear-gradient(180deg, rgba(200,169,81,.2), rgba(200,169,81,.06)); box-shadow:inset 0 0 34px rgba(200,169,81,.14); white-space:nowrap; will-change:transform,opacity}
  .stk-n{font-family:var(--sans); font-weight:700; font-size:.62em; color:var(--gold); opacity:.85}
  .stk-cap{position:absolute; left:0; right:0; top:0; text-align:center; font-weight:600; font-size:62px; line-height:1.1; color:var(--gold-l); text-shadow:0 0 60px rgba(200,169,81,.7); will-change:opacity,transform}

  /* ---- hand (a five-point mnemonic: one finger per point, the point's word in the palm) ---- */
  .hand-halo{position:absolute; width:1040px; height:1040px; border-radius:50%; pointer-events:none; will-change:opacity,transform;
    background:radial-gradient(circle closest-side, rgba(236,208,128,.42), rgba(200,169,81,.13) 42%, rgba(200,169,81,0) 74%)}
  .hand-rays{position:absolute; width:1500px; height:1500px; border-radius:50%; pointer-events:none; mix-blend-mode:screen; filter:blur(4px); will-change:opacity,transform;
    background:repeating-conic-gradient(rgba(244,220,150,.30) 0deg 2.4deg, rgba(244,220,150,0) 2.4deg 9deg, rgba(244,220,150,.14) 9deg 10.4deg, rgba(244,220,150,0) 10.4deg 18deg);
    -webkit-mask-image:radial-gradient(circle closest-side, transparent 14%, #000 30%, rgba(0,0,0,.35) 52%, transparent 76%);
    mask-image:radial-gradient(circle closest-side, transparent 14%, #000 30%, rgba(0,0,0,.35) 52%, transparent 76%)}
  .hand-svg{position:absolute; left:0; top:0; overflow:visible}
  .hand-word{position:absolute; width:max-content; white-space:nowrap; font-style:italic; font-weight:600; font-size:68px; line-height:1.1; color:var(--gold-l);
    text-shadow:0 0 46px rgba(200,169,81,.65), 0 2px 18px rgba(4,8,15,.8); will-change:opacity,transform}

  /* ---- phone (live-site screenshots) ---- */
  .ph-halo{position:absolute; border-radius:50%; pointer-events:none; will-change:opacity,transform;
    background:radial-gradient(circle closest-side, rgba(200,169,81,.30), rgba(200,169,81,.09) 46%, rgba(200,169,81,0) 74%)}
  .ph-wrap{position:absolute; will-change:transform,opacity}
  .ph-body{position:absolute; left:0; top:0; right:0; bottom:0; border-radius:60px; background:#04070d; border:2px solid rgba(230,201,117,.72);
    box-shadow:0 0 0 7px rgba(8,13,24,.92), 0 0 0 8px rgba(200,169,81,.26), 0 34px 90px rgba(0,0,0,.62), 0 0 90px rgba(200,169,81,.30)}
  .ph-body::before, .ph-body::after{content:""; position:absolute; width:5px; background:rgba(230,201,117,.62)}
  .ph-body::before{left:-14px; top:17%; height:6.5%; border-radius:3px 0 0 3px; box-shadow:0 86px 0 rgba(230,201,117,.62)}
  .ph-body::after{right:-14px; top:22%; height:10%; border-radius:0 3px 3px 0}
  .ph-scr{position:absolute; border-radius:48px; overflow:hidden; background:#0a1628}
  .ph-img{position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; object-position:50% 0; opacity:0; will-change:transform,opacity}
  .ph-glare{position:absolute; top:-20%; left:0; width:46%; height:140%; z-index:5; pointer-events:none; will-change:transform,opacity;
    background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.17) 45%, rgba(255,255,255,.05) 62%, rgba(255,255,255,0))}
  .ph-isl{position:absolute; left:50%; top:24px; width:92px; height:24px; margin-left:-46px; border-radius:13px; background:#04070d; z-index:6}
  .ph-dots{position:absolute; left:0; right:0; display:flex; justify-content:center; gap:14px}
  .ph-dot{width:12px; height:12px; border-radius:50%; background:rgb(230,201,117); will-change:transform,opacity}

  /* ---- end card ---- */
  .endc{position:absolute; left:0; right:0; top:560px; display:flex; flex-direction:column; align-items:center}
  .eglow{position:absolute; left:50%; top:140px; width:700px; height:700px; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(200,169,81,.32), transparent 62%); filter:blur(30px)}
  .elogo{position:relative; width:280px; height:280px; border-radius:62px; box-shadow:0 0 90px rgba(200,169,81,.35), 0 0 0 2px rgba(200,169,81,.35); will-change:opacity,transform}
  .ename{font-family:var(--sans); font-weight:700; text-transform:uppercase; letter-spacing:.3em; text-indent:.3em; font-size:58px; color:var(--gold-l); margin-top:64px}
  .eline{font-size:54px; line-height:1.2; margin-top:44px; text-align:center; max-width:880px; text-wrap:balance}
  .eurl{font-family:var(--sans); letter-spacing:.1em; font-size:38px; color:var(--dim); margin-top:40px}

  .echo{position:absolute; left:50%; white-space:nowrap; font-weight:700; font-size:400px; line-height:1; letter-spacing:-.01em;
    color:rgba(230,201,117,.035); -webkit-text-stroke:2.5px rgba(230,201,117,.3); will-change:opacity,transform}
  .echo.sky{color:rgba(159,195,232,.035); -webkit-text-stroke-color:rgba(159,195,232,.3)}
  /* ---- atmosphere + effects ---- */
  .rays{position:absolute; inset:0; mix-blend-mode:screen; pointer-events:none}

<body>
<div id="stage">

</div>

<script>
(function(){
  "use strict";
  var W=1080, H=1920, XF=400;
  var SAFE_TOP=215, SAFE_BOT=1545;         // Instagram/TikTok UI-safe band for the composition
  var GAP_HF=66, GAP_FN=60, FIG_MAX=720;
  // motion: a spark leaves the headline's coloured words, flies to the part of the picture this beat
  // is about, and ignites it — so the picture answers the words. All of it is a pure function of t.
  var COMET_AT=380, COMET_DUR=520, FIG_DELAY=COMET_AT+COMET_DUR-140, FOCUS_ZOOM=1.06, FORM_DUR=1150;

  var DEMO={ format:"framereel", scenes:[
    { beats:[{ say:"A demo of the frame reel template.", kick:"Demo", head:"One idea.\n*One picture.*", sub:"Open with a real spec to preview a reel." }] },
    { figure:{ type:"bars", rows:[{label:"First thing", value:7, c:"sky"},{label:"Second thing", value:5800, display:"5,800", c:"gold"}] },
      beats:[
        { say:"Here is the first thing on its own.", head:"Start with ~one~ bar.", show:{lit:[0]}, note:"Source line" },
        { say:"And here is the second next to it.", head:"Then set the *other* beside it.", show:{lit:[0,1], cur:1} } ] }
  ], end:{ line:"Read the full case — free", say:"Read the full case, for free, at Apolojia Daily." } };

  var SPEC = window.__SPEC || DEMO;
  var scenesEl=document.getElementById("scenes"), brandEl=document.getElementById("brand");
  var model=[];

  // ---------- small helpers ----------
  function mk(cls, parent, tag){ var e=document.createElement(tag||"div"); if(cls) e.className=cls; (parent||scenesEl).appendChild(e); return e; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  // inline colour markup:  *gold*   ~sky~   and \n for a forced line break
  function rich(s){ return esc(s==null?"":s).replace(/\*([^*]+)\*/g,'<span class="g">$1</span>').replace(/~([^~]+)~/g,'<span class="s">$1</span>').replace(/\n/g,"<br>"); }
  function clamp(x){ return x<0?0:x>1?1:x; }
  function ease(x){ return 1-Math.pow(1-clamp(x),3); }
  function easeBack(x){ x=clamp(x); var c1=1.70158, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }
  function lerp(a,b,p){ return a+(b-a)*p; }
  function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  var RGB={gold:[230,201,117], sky:[159,195,232], cream:[250,238,218], dim:[196,188,173]};
  function mixRGB(a,b,p){ return "rgb("+Math.round(lerp(a[0],b[0],p))+","+Math.round(lerp(a[1],b[1],p))+","+Math.round(lerp(a[2],b[2],p))+")"; }
  function has(a,i){ return !!a && a.indexOf(i)>=0; }
  // rank of item i among the items that are NEWLY lit in this beat (drives the stagger)
  function newRank(prev,cur,i){ var r=0; cur=cur||[]; for(var k=0;k<cur.length;k++){ if(cur[k]===i) return r; if(!has(prev,cur[k])) r++; } return 0; }
  function litv(P,C,i,lt,dur){ var a=has(P.lit,i)?1:0, b=has(C.lit,i)?1:0; if(a===b) return a;
    return lerp(a,b,ease((lt-120-(b?newRank(P.lit,C.lit,i):0)*190)/(dur||720))); }
  function curv(P,C,i,lt){ var a=(P.cur===i)?1:0, b=(C.cur===i)?1:0; if(a===b) return a; return lerp(a,b,ease((lt-120)/520)); }
  function focv(P,C,lt){ var a=(P.cur!=null)?1:0, b=(C.cur!=null)?1:0; if(a===b) return a; return lerp(a,b,ease((lt-120)/520)); }
  // numbers that count up: keeps any prefix/suffix ("~", "AD ", "%", "+") and thousands commas
  function parseNum(s){ s=String(s); var m=s.match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)(.*)$/); if(!m) return null;
    var raw=m[2]; return {pre:m[1], v:parseFloat(raw.replace(/,/g,"")), post:m[3], dec:(raw.split(".")[1]||"").length, comma:raw.indexOf(",")>=0}; }
  function fmtNum(pn, v){ var s=v.toFixed(pn.dec); if(pn.comma){ var p=s.split("."); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,","); s=p.join("."); } return pn.pre+s+pn.post; }
  function lines(el){ var cs=getComputedStyle(el), lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.14; return Math.round(el.offsetHeight/lh); }
  function fitLines(el, max, min, maxLines){ var fs=max; el.style.fontSize=fs+"px";
    while(fs>min && (lines(el)>maxLines || el.scrollWidth>el.clientWidth+2)){ fs-=3; el.style.fontSize=fs+"px"; } }
  // A headline is built word by word so each word can wipe in on its own. Colour runs (*gold*, ~sky~)
  // are kept as one span so a spark can launch from them and (in a statement scene) they can FORM out of dust.
  var NL=String.fromCharCode(10);
  function buildHead(parent, text, explicit){
    var h=mk("head", parent), words=[], runs=[];
    (explicit?String(text).split(NL):[String(text).split(NL).join(" ")]).forEach(function(lt){
      var line=mk("hl", h), re=/\*([^*]+)\*|~([^~]+)~|([^*~]+)/g, m;
      while((m=re.exec(lt))){ var c=m[1]!=null?"g":(m[2]!=null?"s":""), txt=m[1]||m[2]||m[3];
        if(/^\s/.test(txt)) line.appendChild(document.createTextNode(" "));
        var core=txt.trim(); if(core){ var run=mk("run"+(c?" "+c:""), line, "span"), rw=[];
          core.split(/\s+/).forEach(function(wd,i){ if(i) run.appendChild(document.createTextNode(" "));
            var w=mk("w", run, "span"); w.textContent=wd; var rec={el:w, c:c, k:words.length}; words.push(rec); rw.push(rec); });
          runs.push({el:run, c:c, words:rw}); }
        if(/\s$/.test(txt)) line.appendChild(document.createTextNode(" ")); } });
    if(explicit) h.style.whiteSpace="nowrap";
    return {el:h, words:words, runs:runs};
  }
  // explicit line breaks are respected (shrink to fit the width, never re-wrap); returns false if it cannot fit
  function fitHead(H, explicit, max, min, maxLines){ var el=H.el, fs=max; el.style.fontSize=fs+"px";
    if(explicit){ while(fs>min && el.scrollWidth>el.clientWidth+2){ fs-=2; el.style.fontSize=fs+"px"; } return el.scrollWidth<=el.clientWidth+2; }
    while(fs>min && lines(el)>maxLines){ fs-=3; el.style.fontSize=fs+"px"; } return true; }

  // ---------- readout: one or two big numbers with labels, counting up between beats ----------
  function Readout(parent, big){
    var el=mk("ro"+(big?" big":""), parent);
    var slots=[0,1].map(function(){ var s=mk("ro-item", el); return {el:s, num:mk("ro-num", s), lab:mk("ro-lab", s)}; });
    var opEl=mk("ro-op"); el.insertBefore(opEl, slots[1].el);
    function norm(S){ var r=S.readout; if(!r && S.num!=null) r=[{num:S.num, label:S.label, c:S.c}]; return {items:r||[], op:S.op||""}; }
    function key(it){ return it?(it.num+"|"+(it.label||"")+"|"+(it.c||"")):""; }
    function isTw(it){ return !!it && String(it.num).indexOf("^")>=0; }
    function tower(p, i){ return esc(p[i])+(i<p.length-1?'<sup class="tw">'+tower(p,i+1)+'</sup>':''); }
    // a power tower ("10^10^123"): each level pops in after the one below it. at = ms for each raised level
    function stage(sl, l2, at){ var su=sl.num.querySelectorAll("sup.tw"); for(var k=0;k<su.length;k++){ var x=(l2-((at&&at[k]!=null)?at[k]:(620+k*640)))/520;
      su[k].style.opacity=clamp(x*2.2); su[k].style.transform="scale("+(0.35+0.65*easeBack(x))+")"; } }
    function paint(sl, it, text){ var tw=isTw(it);
      if(tw){ if(sl._tw!==String(it.num)){ sl.num.innerHTML=tower(String(it.num).split("^"),0); sl._tw=String(it.num); } } else { sl._tw=null; sl.num.textContent=text; }
      sl.num.className="ro-num c-"+(it.c||"gold")+(tw?" tower":""); sl.lab.innerHTML=rich(it.label||""); sl.lab.style.display=it.label?"":"none"; }
    return { el:el, forms:function(PS, CS){ var P=norm(PS), C=norm(CS), out=[];
        for(var i=0;i<2;i++){ var a=P.items[i], b=C.items[i]; if(b && key(a)!==key(b) && !isTw(b)) out.push({el:slots[i].num, text:String(b.num), anchor:"center", c:b.c||"gold", at:(a?260:140), dur:850}); }
        return out; },
      changed:function(PS, CS){ var P=norm(PS), C=norm(CS); return key(P.items[0])!==key(C.items[0]) || key(P.items[1])!==key(C.items[1]); },
      set:function(PS, CS, lt){
      var P=norm(PS), C=norm(CS), shown=0;
      for(var i=0;i<2;i++){ var a=P.items[i], b=C.items[i], sl=slots[i];
        if(key(a)===key(b)){ if(b){ paint(sl,b,String(b.num)); if(isTw(b)) stage(sl,1e9); sl.el.style.opacity=1; sl.el.style.display=""; shown++; } else sl.el.style.display="none"; continue; }
        if(a && lt<260){ paint(sl,a,String(a.num)); sl.el.style.opacity=1-clamp(lt/260); sl.el.style.display=""; shown++; continue; }
        if(!b){ sl.el.style.display="none"; continue; }
        var l2=lt-(a?260:140), pb=parseNum(b.num), pa=a?parseNum(a.num):null, txt=String(b.num);
        if(pb){ var from=(pa&&b.count!==false)?pa.v:0; if(b.count===false) from=pb.v; txt=fmtNum(pb, lerp(from, pb.v, ease(l2/1150))); }
        paint(sl,b,txt); if(isTw(b)){ stage(sl,l2,CS.twAt); sl.el.style.opacity=ease((l2-60)/420); } else sl.el.style.opacity=ease((l2-420)/480); sl.el.style.display=""; shown++; }
      el.classList.toggle("two", shown>1);
      var op=(lt<260 && P.items.length>1)?P.op:C.op; opEl.textContent=op||""; opEl.style.display=(shown>1 && op)?"":"none";
      opEl.style.opacity=(P.op===C.op && P.items.length>1 && C.items.length>1)?1:ease((lt-520)/420);
      el.style.transform="none"; var sw=el.scrollWidth; if(sw>900) el.style.transform="scale("+(900/sw)+")";
    }};
  }

  // ---------- figures ----------
  // A figure factory gets (def, el, states) and returns { h, render(prevState, curState, lt, slt, t) }.
  //   lt  = ms since the current beat took over · slt = ms since the scene began · t = absolute ms
  var FIG={};
  // which elements a beat newly lights — the spark flies to these
  function newly(P,C){ return (C.lit||[]).filter(function(i){ return !has(P.lit,i); }); }
  function litTargets(P,C,elOf){ var n=newly(P,C); if(n.length) return n.map(elOf);
    if(C.cur!=null && C.cur!==P.cur && has(C.lit,C.cur)) return [elOf(C.cur)]; return []; }

  // grid — each dot is one unit. show:{ lit: n | [{n,c},…], readout:[{num,label,c}], op }
  FIG.grid=function(def, el, states){
    var hasRo=states.some(function(S){ return S.readout || S.num!=null; });
    var ro=hasRo?Readout(el,false):null, roH=hasRo?(def.readoutH||262):0;
    var N=def.total, Wd=def.width||860, maxH=(def.maxH||FIG_MAX)-roH;
    var cols=Math.max(1, Math.ceil(Math.sqrt(N*Wd/maxH))), rows=Math.ceil(N/cols);
    var sp=Math.min(Wd/cols, maxH/rows, 104), gw=cols*sp, gh=rows*sp;
    var rad=Math.max(1.3, Math.min(sp*0.3, 15)), glow=rad>=5;
    var cv=mk("", el, "canvas"); cv.width=920; cv.height=Math.ceil(gh)+40; cv.style.cssText="position:absolute;left:0;top:"+(roH-20)+"px";
    var ctx=cv.getContext("2d"), ox=(920-gw)/2, oy=20;
    var order=[], i; for(i=0;i<N;i++) order.push(i);
    if(def.scatter){ var r=rng(def.seed||4242); for(i=N-1;i>0;i--){ var j=Math.floor(r()*(i+1)), tmp=order[i]; order[i]=order[j]; order[j]=tmp; } }
    function segs(S){ var l=S.lit; if(l==null) return []; if(typeof l==="number") return [{n:l, c:S.c||"gold"}]; return l; }
    function colAt(sg, k){ var acc=0; for(var q=0;q<sg.length;q++){ acc+=sg[q].n; if(k<acc) return sg[q].c||"gold"; } return null; }
    function dot(x,y,c,a){ if(a<=0.004) return; var col=RGB[c]||RGB.gold; ctx.globalAlpha=a; ctx.fillStyle="rgb("+col[0]+","+col[1]+","+col[2]+")";
      if(glow){ ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=rad*1.6; }
      ctx.beginPath(); ctx.arc(x,y,rad,0,6.2832); ctx.fill(); }
    return { h:roH+gh,
      targets:function(P,C){ var a=segs(P), b=segs(C); for(var k=0;k<N;k++){ if(colAt(a,k)!==colAt(b,k)){ var pos=order[k], lx=ox+(pos%cols)*sp+sp/2, ly=oy+Math.floor(pos/cols)*sp+sp/2;
          return [{c:colAt(b,k)||"gold", pt:function(){ var r=cv.getBoundingClientRect(), z=r.width/cv.width; return [r.left+lx*z, r.top+ly*z]; }}]; } }
        return (ro&&ro.changed(P,C))?[{el:ro.el, ay:0.3}]:[]; },
      forms:function(P,C){ return ro?ro.forms(P,C):[]; },
      render:function(P,C,lt,slt,t){
      if(ro) ro.set(P,C,lt);
      var sp_=segs(P), sc=segs(C), intro=ease(slt/900);
      ctx.clearRect(0,0,cv.width,cv.height);
      for(var k=0;k<N;k++){ var pos=order[k], x=ox+(pos%cols)*sp+sp/2, y=oy+Math.floor(pos/cols)*sp+sp/2;
        ctx.shadowBlur=0; ctx.globalAlpha=0.17*intro; ctx.fillStyle="rgb(159,195,232)"; ctx.beginPath(); ctx.arc(x,y,rad,0,6.2832); ctx.fill();
        var a=colAt(sp_,k), b=colAt(sc,k); if(!a && !b) continue;
        var tw=0.66+0.34*Math.abs(Math.sin(t/640+k*1.7));
        if(a===b){ dot(x,y,b,tw); continue; }
        var q=clamp(((lt-150)/1500-(k/N)*0.6)/0.4);
        if(a) dot(x,y,a,tw*(1-q)); if(b) dot(x,y,b,tw*q); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
    }};
  };

  // number — one giant figure (or a matched pair). show:{ num, label, c }  or  { readout:[…two…], op:"=" }
  FIG.number=function(def, el, states){
    mk("numglow", el); var ro=Readout(el,true);
    // def.zeros: rows of zeros that keep being written under the number while show.zeros is true
    //   ("you could not write its zeros"). Orderly rows, one writing head, the oldest row fading out at the top.
    var Z=null; if(def.zeros){ var zo=typeof def.zeros==="object"?def.zeros:{}; Z={cols:zo.cols||24, rows:zo.rows||5, cps:zo.cps||46, rh:zo.rowH||56, el:mk("zrows", el), r:[]};
      Z.el.style.top=(zo.top||470)+"px"; Z.el.style.height=(Z.rows*Z.rh)+"px"; Z.in=mk("zin", Z.el);
      for(var zi=0;zi<=Z.rows;zi++){ var zr=mk("zrow", Z.in); zr.style.height=Z.rh+"px"; zr.style.lineHeight=Z.rh+"px"; Z.r.push({el:zr, a:mk("",zr,"span"), b:mk("zhead",zr,"span")}); }
      Z.r[0].a.textContent=zline(Z.cols); var zw=Z.r[0].a.offsetWidth; Z.r[0].a.textContent=""; Z.in.style.paddingLeft=Math.max(0,(860-zw)/2)+"px"; }
    function zline(n){ var o=""; for(var i=0;i<n;i++) o+=(i&&i%3===0?" ":"")+"0"; return o; }
    return { h:def.h||470, targets:function(P,C){ var o=ro.changed(P,C)?[{el:ro.el, ay:0.3}]:[]; if(Z && C.zeros && !P.zeros) o.push({el:Z.el, ay:0.2}); return o; },
      forms:function(P,C){ return ro.forms(P,C); },
      render:function(P,C,lt,slt,t){ ro.set(P,C,lt);
        if(Z){ var a=P.zeros?1:0, b=C.zeros?1:0, q=(a===b)?b:lerp(a,b,ease((lt-200)/600)); Z.el.style.opacity=q; if(q<=0) return;
          var n=Math.max(0,(t||0)/1000*Z.cps), n0=(b && !a)?Math.max(0, n-Math.max(0,lt-200)/1000*Z.cps):-1, r0=Math.floor(n/Z.cols), part=n-r0*Z.cols;
          Z.in.style.transform="translateY("+(-(part/Z.cols)*Z.rh)+"px)";
          for(var j=0;j<Z.r.length;j++){ var ri=r0-(Z.r.length-1-j), row=Z.r[j], cur=(j===Z.r.length-1), cnt=cur?Math.floor(part):Z.cols;
            var vis=(ri>=0) && (ri*Z.cols>=n0);
            row.el.style.visibility=vis?"visible":"hidden"; if(!vis) continue;
            row.a.textContent=zline(cur?Math.max(0,cnt-1):cnt)+((cur && cnt>1 && (cnt-1)%3===0)?" ":""); row.b.textContent=(cur && cnt>0)?"0":""; } } } };
  };

  // bars — 2–5 horizontal bars, proportional. def.rows:[{label,value,display?,c}]. show:{ lit:[…], cur }
  FIG.bars=function(def, el){
    var rows=def.rows, max=def.max||Math.max.apply(null, rows.map(function(r){ return r.value; }));
    var wrap=mk("bars", el);
    var items=rows.map(function(r){ var row=mk("brow", wrap), top=mk("btop", row), lab=mk("blab", top); lab.innerHTML=rich(r.label); if(def.labSize) lab.style.fontSize=def.labSize+"px";
      var val=mk("bval c-"+(r.c||"gold"), top), tr=mk("btrack", row), fill=mk("bfill "+(r.c||"gold"), tr);
      var disp=(r.display!=null)?String(r.display):String(r.value); val.textContent=disp;
      return {el:row, val:val, fill:fill, tr:tr, r:r, disp:disp, pn:parseNum(disp)}; });
    return { h:wrap.offsetHeight,
      targets:function(P,C){ return litTargets(P,C,function(i){ return {el:items[i].tr, ax:0.01, c:items[i].r.c||"gold"}; }); },
      focus:function(C){ return C.cur!=null?items[C.cur].el:null; },
      render:function(P,C,lt){
      var f=focv(P,C,lt);
      items.forEach(function(it,i){ var v=litv(P,C,i,lt), a=has(P.lit,i), b=has(C.lit,i);
        var g=(a===b)?(b?1:0):(b?ease((lt-260-newRank(P.lit,C.lit,i)*190)/1150):1-ease(lt/300));
        it.el.style.opacity=clamp(v*1.5)*(1-0.5*f*(1-curv(P,C,i,lt)));
        it.el.style.transform="translateY("+((1-v)*20)+"px)";
        it.fill.style.width=(Math.max(1.3, it.r.value/max*100)*g)+"%";
        it.val.textContent=it.pn?fmtNum(it.pn, it.pn.v*g):it.disp; });
    }};
  };

  // steps — 2–5 short rows that arrive one at a time. def.items:["…"|{t,sub,mark}]. show:{ lit:[…], cur }
  FIG.steps=function(def, el){
    var wrap=mk("steps", el), ghost=def.ghost?0.22:0;
    var items=def.items.map(function(it,i){ if(typeof it==="string") it={t:it};
      var row=mk("srow", wrap), mark=mk("smark", row); mark.textContent=it.mark||String(i+1);
      var tx=mk("stext", row), t1=mk("st", tx); t1.innerHTML=rich(it.t); if(it.sub){ var s2=mk("ssub", tx); s2.innerHTML=rich(it.sub); }
      return {el:row, mark:mark, t:t1}; });
    var fs=def.size||80; wrap.style.fontSize=fs+"px"; while(fs>44 && wrap.offsetHeight>FIG_MAX){ fs-=3; wrap.style.fontSize=fs+"px"; }
    return { h:wrap.offsetHeight,
      targets:function(P,C){ return litTargets(P,C,function(i){ return {el:items[i].mark}; }); },
      focus:function(C){ return C.cur!=null?items[C.cur].el:null; },
      spot:function(C){ return C.cur!=null?items[C.cur].mark:null; },
      render:function(P,C,lt){
      var f=focv(P,C,lt);

      fx.fillStyle="rgb("+col+")";
      for(var i=0;i<G.pts.length;i++){ var p=G.pts[i], d=(p.x/G.w)*0.42*dur+p.j*0.14*dur, e=ease((t-t0-d)/(dur*0.5)); if(e<=0) continue;
        var R=p.R*Math.pow(1-e,1.25), an=p.a+2.6*(1-e);
        fx.globalAlpha=Math.min(1,e*2.5)*out*(0.5+0.5*p.j); fx.fillRect(x0+p.x*k+R*Math.cos(an)-sz/2, y0+p.y*k+R*Math.sin(an)*0.8-sz/2, sz, sz); }
      fx.globalAlpha=1; }};
  }
  function drawFX(t){ fx.clearRect(0,0,W,H); fx.globalCompositeOperation="lighter";
    for(var i=0;i<FX.length;i++){ var e=FX[i]; if(t>=e.t0 && t<=e.t1) e.draw(t); } }
  function headAt(m, bi){ for(var i=0;i<m.heads.length;i++){ if(bi>=m.heads[i].from && bi<=m.heads[i].to) return m.heads[i]; } return null; }
  function localY(el, figEl){ var a=el.getBoundingClientRect(), b=figEl.getBoundingClientRect(); return a.top+a.height/2-b.top; }
  // turn the spec's beats into timed effects: where each spark launches and lands, what forms, where the camera looks
  function plan(){
    model.forEach(function(m, si){ if(si>0) TR.push(sceneWin(si).start+XF/2);
      if(m.end) return;
      m.heads.forEach(function(sg){ if(!sg.H) return; var t0=beatWin(si, sg.from).start+XF/2;
        sg.H.runs.forEach(function(run){ if(run.formAt!=null) FX.push(formText(run.el, t0+run.formAt, FORM_DUR, run.c)); }); });
      if(!m.fig) return;
      if(m.fig.ambient){ var swA=sceneWin(si); FX.unshift({t0:swA.start, t1:swA.start+swA.dur, draw:function(t){ m.fig.ambient(t, t-swA.start); }}); }
      m.delay=[]; m.cam=[];
      for(var b=0; b<m.beats; b++){ (function(bi){
        var P=bi?m.states[bi-1]:{}, C=m.states[bi], tb=beatWin(si,bi).start+XF/2;
        var tg=(m.fig.targets?m.fig.targets(P,C):[]).slice(0,6); m.delay[bi]=tg.length?FIG_DELAY:0;
        var sg=headAt(m,bi), src=(sg&&sg.H)?(sg.H.runs.filter(function(r){ return r.c; })[0]||null):null;
        var srcEl=src?src.el:((sg&&sg.H)?sg.H.el:null), col=(src&&src.c==="s")?"sky":"gold";
        if(srcEl) tg.forEach(function(g,k){ var t0=tb+COMET_AT+k*190, seed=si*1000+bi*10+k+1, to=targetPt(g);
          FX.push(comet(t0, COMET_DUR, g.from?rectPt(g.from):rectPt(srcEl,0.5,0.86), to, g.c||col, seed, g.bend)); FX.push(ripple(t0+COMET_DUR-30, to, g.c||col, seed)); });
        (m.fig.forms?m.fig.forms(P,C):[]).forEach(function(f){ FX.push(formText(f.el, tb+m.delay[bi]+f.at, f.dur||800, f.c, f)); });
        var fe=m.fig.focus?m.fig.focus(C):null; m.cam[bi]=fe?{s:FOCUS_ZOOM, y:localY(fe, m.figEl)}:{s:1, y:m.fig.h/2};
        var spt=m.fig.spot?m.fig.spot(C):null, sw=sceneWin(si);
        if(spt) FX.push(ambient(rectPt(spt), tb+m.delay[bi]+420, (bi+1<m.beats)?(beatWin(si,bi+1).start+XF/2+COMET_AT+COMET_DUR*0.6):(sw.start+sw.dur), C.spanC||"gold", si*1000+bi*10+7));
      })(b); }
    });
  }

  var _c={}; function q(sel){ return _c[sel]||(_c[sel]=document.querySelector(sel)); }
  function seek(t){
    drawField(t); var s=t/1000;
    q(".a1").style.transform="translate("+(Math.sin(s*0.33)*70)+"px,"+(Math.cos(s*0.3)*40)+"px) scale("+(1+Math.sin(s*0.33)*0.08)+")";
    q(".a2").style.transform="translate("+(Math.cos(s*0.27)*-60)+"px,"+(Math.sin(s*0.27)*50)+"px) scale("+(1.1+Math.cos(s*0.27)*0.1)+")";
    q(".a3").style.transform="translate("+(Math.sin(s*0.22)*50)+"px,"+(Math.cos(s*0.22)*-45)+"px)";
q(".bloom").style.opacity=Math.min(1, 0.3+Math.abs(Math.sin(s*0.9))*0.32+warp(t)[0]*0.4);
    q(".r1").style.transform="rotate("+(9+Math.sin(s*0.21)*4)+"deg)"; q(".r2").style.transform="rotate("+(-3+Math.sin(s*0.17+1)*5)+"deg)"; q(".r3").style.transform="rotate("+(-11+Math.sin(s*0.19+2)*4)+"deg)";
    q(".sweep").style.left=(-360+((t%11000)/11000)*1.9*W)+"px";

    var endOp=0;
    for(var si=0; si<model.length; si++){
      var m=model[si], sw=sceneWin(si), slt=t-sw.start, sop=fade(slt, sw.dur);
      if(si===model.length-1 && slt>XF) sop=1;                       // the last scene holds to the final frame
      m.el.style.opacity=sop; m.el.style.visibility=sop>0?"visible":"hidden"; if(sop<=0) continue;
      if(m.end){ endOp=sop; var pb=easeBack((slt-250)/800);
        m.logo.style.opacity=clamp((slt-250)/350); m.logo.style.transform="scale("+(0.6+0.4*pb)+")"; m.eglow.style.opacity=ease((slt-250)/900)*(0.75+0.25*Math.sin(s*1.4));
        [m.ename, m.eline, m.eurl].forEach(function(e,i){ var p=ease((slt-650-i*230)/650); e.style.opacity=p; e.style.transform="translateY("+((1-p)*22)+"px)"; });
        continue; }
      var say=!m.fig;
      for(var h=0; h<m.heads.length; h++) segShow(m.heads[h], si, t, say);
      if(m.notes) for(var n=0; n<m.notes.length; n++) segFade(m.notes[n], si, t);
      for(var ei=0; ei<m.echos.length; ei++){ var eg=m.echos[ei], e0=beatWin(si, eg.from), e1=beatWin(si, eg.to), es=e0.start+XF/2+500, ee=e1.start+e1.dur-XF/2;
        var ein=ease((t-es)/1400), eout=clamp((ee-t)/450), eo=Math.min(ein, eout); eg.el.style.opacity=eo;
        if(eo>0){ var eu=clamp((t-es)/(ee-es)); eg.el.style.transform="translate(calc(-50% + "+(22-44*eu)+"px), -50%) scale("+(1.06-0.06*ein)+")"; } }
      if(m.fig){ var bi=0; for(var b=0; b<m.beats; b++){ if(t>=beatWin(si,b).start+XF/2) bi=b; }
        var lt=t-(beatWin(si,bi).start+XF/2); if(bi===0) lt=Math.max(lt, 0);
        m.figEl.style.opacity=ease(slt/700);
        // camera: a slow continuous push-in, plus a move toward whatever this beat is about
        var c0=bi?m.cam[bi-1]:{s:1, y:m.fig.h/2}, c1=m.cam[bi], cq=easeIO((lt-200)/1300);
        m.figEl.style.transformOrigin="460px "+lerp(c0.y, c1.y, cq)+"px";
        var hit=(lt-(COMET_AT+COMET_DUR))/340, punch=(m.delay[bi] && hit>0 && hit<1)?0.03*Math.sin(Math.PI*hit)*(1-hit):0;
        m.figEl.style.transform="translateY("+(Math.sin(s*0.55)*5)+"px) scale("+(lerp(c0.s, c1.s, cq)*(1+0.04*clamp(slt/sw.dur))*(1+punch))+")";
        // the picture waits for the spark: it changes when the spark lands, not when the headline appears
        m.fig.render(bi?m.states[bi-1]:{}, m.states[bi], Math.max(0, lt-m.delay[bi]), slt, t); }
    }
    drawFX(t);
    brandEl.style.opacity=0.6*(1-endOp);
  }
  function total(){ var w=sceneWin(model.length-1); return w.start+w.dur; }

  window.__seek=seek; window.__total=total;
  var imgReady=function(){ return Promise.all([].slice.call(document.images).map(function(im){ if(im.complete) return (im.decode?im.decode().catch(function(){}):null);
      return new Promise(function(r){ im.onload=function(){ (im.decode?im.decode().catch(function(){}):Promise.resolve()).then(r); }; im.onerror=r; }); })); };
  window.__ready=(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){ build(); plan(); seedField(); return imgReady(); }).then(function(){ seek(0); return {total:total()}; });

  if(!window.__CAPTURE){ window.__ready.then(function(){
    var m=/[#&]t=(\d+)/.exec(location.hash); if(m) seek(+m[1]);
    var raf, t0; function loop(){ var t=performance.now()-t0; if(t>=total()){ seek(total()); return; } seek(t); raf=requestAnimationFrame(loop); }
    document.getElementById("play").addEventListener("click", function(){ cancelAnimationFrame(raf); t0=performance.now(); loop(); });
  }); }
})();
</script>
