<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apologia web reel</title>
<!--
  reel.html — the animated "Frames of Quran"-style reel template for Apologia Daily.

  ONE source of truth for the visuals, driven two ways:
    • Live preview:  open this file, press Play (uses the browser voice as a stand-in).
    • MP4 capture:   gen_webreel.py injects window.__SPEC + window.__TIMINGS, then
                     capture-webreel.mjs steps window.__seek(tMs) frame by frame.

  ALL motion is a pure function of time t (ms): seek(t) fully positions the frame —
  no CSS animations, no rAF state — so a captured frame at t is identical every run.

  Scene engine (v2): a scene can hold a PERSISTENT structure (stats row, list,
  constellation, chiasm or count-up number) that stays on screen while a sequence of
  BEATS cycles the headline + narration above it — the device that makes the originals
  pop. Lines support per-word highlight colours (gold / sky). Designed at 1080x1920.
  Brand palette matches answers/answers.css.
-->
<!-- fonts match tools/reel/gen_reel.py: Georgia (serif) + Arial (sans) — both system fonts, no web load -->>
<style>
  :root{
    --navy:#0a1628; --navy2:#0f2040; --navy3:#13284d; --blue:#1c3a6e;
    --gold:#c8a951; --gold-l:#e6c975; --gold-d:#a88930;
    --sky:#9fc3e8; --cream:#faeeda; --dim:#c4bcad;
    --serif:Georgia, "Times New Roman", serif;               /* matches gen_reel.py serif */
    --body:Georgia, "Times New Roman", serif;
    --sans:Arial, "Helvetica Neue", Helvetica, sans-serif;   /* matches gen_reel.py sans */
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:#000; overflow:hidden}
  #stage{position:absolute; top:0; left:0; width:1080px; height:1920px; overflow:hidden;
    background:radial-gradient(120% 75% at 50% 6%, var(--navy2) 0%, var(--navy) 44%, #04080f 100%);
    font-family:var(--body); color:var(--cream)}

  .aurora b{position:absolute; border-radius:50%; filter:blur(150px); mix-blend-mode:screen; will-change:transform}
  .aurora .a1{width:620px; height:620px; left:-60px; top:150px; background:radial-gradient(circle, var(--blue), transparent 68%)}
  .aurora .a2{width:600px; height:600px; right:-80px; top:620px; background:radial-gradient(circle, rgba(200,169,81,.5), transparent 66%)}
  .aurora .a3{width:720px; height:720px; left:120px; bottom:-120px; background:radial-gradient(circle, var(--navy3), transparent 70%)}
  #sky{position:absolute; inset:0; width:1080px; height:1920px}
  .bloom{position:absolute; left:50%; top:30%; width:760px; height:760px; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(200,169,81,.55) 0%, transparent 62%); filter:blur(40px)}
  .sweep{position:absolute; top:-30%; width:360px; height:160%;
    background:linear-gradient(90deg, transparent, rgba(230,201,117,.10), transparent); transform:rotate(13deg)}
  .horizon{position:absolute; left:50%; bottom:-360px; width:1800px; height:900px; transform:translateX(-50%);
    background:radial-gradient(ellipse at center top, rgba(200,169,81,.22), rgba(28,58,110,.16) 42%, transparent 64%); filter:blur(24px)}

  .scene{position:absolute; inset:0; transform-origin:50% 42%; will-change:opacity,transform}
  /* depth backdrop (arch + mandala), subtle, behind content */
  .deco{position:absolute; left:50%; bottom:0; width:860px; height:1000px; transform:translateX(-50%); opacity:.5}
  .deco .arch{position:absolute; inset:0; border:2px solid rgba(200,169,81,.28); border-bottom:none;
    border-radius:430px 430px 0 0; box-shadow:0 0 70px rgba(200,169,81,.12) inset}
  .deco .arch.inner{left:120px; right:120px; width:auto; bottom:0; top:120px; border-radius:310px 310px 0 0; opacity:.6}
  .deco .pillar{position:absolute; bottom:0; width:26px; height:620px; background:linear-gradient(var(--gold-d), rgba(168,137,48,.15)); opacity:.5}
  .deco .pL{left:40px} .deco .pR{right:40px}
  .deco .mandala{position:absolute; left:50%; bottom:90px; width:260px; height:260px; transform:translateX(-50%);
    border:2px solid rgba(200,169,81,.3); border-radius:50%; box-shadow:0 0 50px rgba(200,169,81,.2)}
  .deco .mandala::after{content:""; position:absolute; inset:46px; border:1px solid rgba(200,169,81,.3); border-radius:50%}

  /* layout: compact-structure scenes pair the headline just above centre with the structure
     just below it (balanced, no void); simple scenes centre; weave scenes put the headline at
     the top with the big web centred below. */
  .structwrap{position:absolute; left:0; right:0; top:44%; display:flex; justify-content:center; align-items:flex-start; padding:34px 80px 0}
  .beat{position:absolute; left:0; right:0; top:0; height:44%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 90px 24px; will-change:opacity}
  .beat.center{height:100%; justify-content:center; padding:0 90px 220px}  /* reserve the footer zone so content centres above it */
  .scene.wv .beat{height:auto; justify-content:flex-start; padding:72px 90px 0}
  .kicker{font-family:var(--sans); text-transform:uppercase; letter-spacing:.22em; font-size:30px; color:var(--gold); margin-bottom:34px; text-align:center; white-space:nowrap}
  .line{font-family:var(--serif); font-weight:400; line-height:1.18; text-align:center; white-space:nowrap; will-change:opacity,transform,filter}
  .line.sm{font-size:50px; font-family:var(--body)}
  .line.md{font-size:60px}
  .line.lg{font-size:84px}
  .line.xl{font-size:104px; line-height:1.05}
  .line.verse{font-style:italic}
  .g{color:var(--gold); font-weight:700; text-shadow:0 0 50px rgba(200,169,81,.4)}  /* gold span/line */
  .s{color:var(--sky)}                                                               /* sky span */
  .line .w{display:inline-block; will-change:opacity,transform,filter}
  .line .ch{display:inline-block; will-change:opacity,transform,filter}
  .line.swl{--sweep:0%; font-weight:700;                              /* gold highlight sweeps across */
    background-image:linear-gradient(90deg, var(--gold) 0%, var(--gold) var(--sweep), var(--cream) var(--sweep), var(--cream) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent}
  .cite{font-family:var(--body); font-size:44px; color:var(--dim); margin-top:26px; letter-spacing:.02em; text-align:center}
  .gap{height:34px}

  /* ---- structures ---- */
  .stats{display:flex; gap:70px; justify-content:center; align-items:flex-end}
  .stat{display:flex; flex-direction:column; align-items:center; will-change:opacity,transform}
  .stat .num{font-family:var(--serif); font-weight:600; font-size:120px; line-height:1; color:var(--gold); text-shadow:0 0 44px rgba(200,169,81,.4)}
  .stat .lab{font-family:var(--sans); text-transform:uppercase; letter-spacing:.2em; font-size:30px; color:var(--dim); margin-top:14px}

  .bignum{display:flex; flex-direction:column; align-items:center; will-change:opacity,transform,filter}
  .bignum .num{font-family:var(--serif); font-weight:600; font-size:230px; line-height:1; color:var(--gold); text-shadow:0 0 80px rgba(200,169,81,.55)}
  .bignum .num sup{font-size:0.4em; vertical-align:super; margin-left:4px}
  .bignum .lab{font-family:var(--body); font-size:46px; color:var(--cream); margin-top:26px; text-align:center; max-width:680px; line-height:1.32}

  .list{display:flex; flex-direction:column; gap:30px; width:100%; max-width:860px}
  .lrow{display:flex; align-items:center; gap:30px; opacity:0; will-change:opacity,transform}
  .lrow .llab{font-family:var(--sans); text-transform:uppercase; letter-spacing:.06em; font-size:30px; font-weight:600; color:var(--gold); width:300px; text-align:right; flex:none; line-height:1.1}
  .lrow .ltext{font-family:var(--serif); font-size:52px; color:var(--cream); line-height:1.14}
  .lrow.hot .llab{color:var(--gold-l)} .lrow.hot .ltext{color:var(--gold-l); text-shadow:0 0 30px rgba(200,169,81,.5)}
  /* default list: a thin gold divider between the label column and the value */
  .list.termlist{width:fit-content; max-width:900px; margin:0 auto; gap:40px}   /* centre the whole label+value block in the frame, with more air between rows */
  .list.termlist .lrow{position:relative; padding-left:30px; gap:44px}   /* wider label↔value breathing room */
  .list.termlist .llab{transform-origin:right center}   /* current-row pulse grows leftward, never into the value */
  .list.termlist .lrow::before{content:""; position:absolute; left:352px; top:50%; width:2px; height:56px; transform:translateY(-50%);
    background:linear-gradient(rgba(200,169,81,0), rgba(200,169,81,.55), rgba(200,169,81,0))}
  /* premises variant: a gold circular badge (number / ∴) + wrapping premise text; centred block */
  .scene.prem .beat{height:24%; justify-content:flex-end; padding-bottom:4px}
  .structwrap.prem-wrap{top:30%; align-items:center; flex-direction:column; padding:0 70px}
  .list.premises{gap:44px; max-width:920px}
  .list.premises .lrow{align-items:center; gap:40px}
  .list.premises .llab{display:flex; align-items:center; justify-content:center; width:104px; height:104px; border-radius:50%;
    border:2px solid rgba(200,169,81,.55); background:radial-gradient(circle at 50% 34%, rgba(200,169,81,.24), rgba(200,169,81,.05));
    font-family:var(--serif); font-weight:700; font-size:58px; letter-spacing:0; color:var(--gold-l); text-align:center; text-transform:none;
    box-shadow:0 0 36px rgba(200,169,81,.18) inset, 0 0 26px rgba(200,169,81,.12); flex:none}
  .list.premises .ltext{font-family:var(--serif); font-size:52px; color:var(--cream); line-height:1.18; max-width:640px; white-space:normal}
  .list.premises .lrow.hot .llab{border-color:var(--gold-l); box-shadow:0 0 56px rgba(230,201,117,.5) inset, 0 0 44px rgba(230,201,117,.4); color:#fff}
  .list.premises .lrow.hot .ltext{color:#fff; text-shadow:0 0 30px rgba(230,201,117,.45)}
  /* traits variant: centred single column, a gold dot + word, lit in sequence */
  .scene.trait .beat{height:24%; justify-content:flex-end; padding-bottom:4px}
  .structwrap.trait-wrap{top:31%; align-items:center; flex-direction:column; padding:0 70px}
  .list.traits{gap:38px; max-width:760px; align-items:center}
  .list.traits .lrow{align-items:center; gap:30px; justify-content:center; position:relative; padding-left:54px}
  .list.traits .lrow::before{content:""; position:absolute; left:0; top:50%; width:26px; height:26px; transform:translateY(-50%);
    border-radius:50%; background:rgba(200,169,81,.3)}
  .list.traits .lrow.hot::before{background:var(--gold-l); box-shadow:0 0 30px var(--gold)}
  .list.traits .ltext{font-family:var(--serif); font-size:64px; color:var(--dim); letter-spacing:.01em; white-space:nowrap}
  .list.traits .lrow.hot .ltext{color:var(--cream); text-shadow:0 0 30px rgba(230,201,117,.45)}
  /* cone diagram scene: text sits high, the expanding-universe cone fills the middle */
  .scene.cone-scene .beat.center{justify-content:flex-start; padding:150px 90px 0}
  /* acrostic list variant: big serif letters; composition lifted up; the CURRENT letter is magnified + spotlit */
  .scene.acro .beat{height:34%; padding-bottom:10px}
  .structwrap.acrostic-wrap{top:35%}
  .list.acrostic{gap:40px; max-width:760px}
  .list.acrostic .lrow{align-items:center; gap:48px}
  .list.acrostic .llab{position:relative; font-family:var(--serif); font-weight:700; font-size:94px; width:112px; text-align:center; line-height:1; color:rgba(200,169,81,.42); will-change:transform,color}
  .list.acrostic .ltext{font-family:var(--serif); font-size:60px; color:var(--dim)}
  .list.acrostic .lrow.hot .llab{color:var(--gold)}
  .list.acrostic .lrow.hot .ltext{color:var(--cream)}
  .list.acrostic .lrow.cur .llab{color:var(--gold-l)}
  .list.acrostic .lrow.cur .ltext{color:#fff; text-shadow:0 0 28px rgba(230,201,117,.55)}
  .list.acrostic .lrow.cur .llab::before{content:""; position:absolute; left:50%; top:50%; width:176px; height:176px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(230,201,117,.44), transparent 66%); z-index:-1}

  /* checklist list variant: a centred list of ✓ marks that light + spotlight the current item */
  .scene.clist .beat{height:23%; padding-bottom:4px}
  .structwrap.cl-wrap{top:27%; padding:0; align-items:center; flex-direction:column}
  .list.checklist{gap:48px; max-width:900px}
  .list.checklist .lrow{align-items:center; gap:40px}
  .list.checklist .llab{position:relative; font-family:var(--sans); font-weight:700; font-size:66px; width:84px; text-align:center; line-height:1; color:rgba(200,169,81,.4); will-change:transform,color}
  .list.checklist .ltext{font-family:var(--serif); font-size:50px; color:var(--dim); white-space:nowrap}
  .list.checklist .lrow.hot .llab{color:var(--gold)}
  .list.checklist .lrow.hot .ltext{color:var(--cream)}
  .list.checklist .lrow.cur .llab{color:var(--gold-l)}
  .list.checklist .lrow.cur .ltext{color:#fff; text-shadow:0 0 26px rgba(230,201,117,.5)}
  .list.checklist .lrow.cur .llab::before{content:""; position:absolute; left:50%; top:50%; width:158px; height:158px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(230,201,117,.42), transparent 66%); z-index:-1}

  .constel{position:relative; width:820px; height:520px}
  .node{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; opacity:0; will-change:opacity}
  .node .dot{width:22px; height:22px; border-radius:50%; background:rgba(200,169,81,.35); box-shadow:0 0 0 rgba(200,169,81,0)}
  .node.hot .dot{background:var(--gold-l); box-shadow:0 0 34px var(--gold)}
  .node .nt{font-family:var(--serif); font-size:46px; color:var(--dim); margin-top:14px; white-space:nowrap}
  .node.hot .nt{color:var(--gold-l); text-shadow:0 0 26px rgba(200,169,81,.5)}
  .node .nsub{font-family:var(--body); font-size:30px; color:var(--dim); opacity:.7; white-space:nowrap}
  .clines{position:absolute; inset:0; overflow:visible}

  .chiasm{display:flex; flex-direction:column; gap:22px; width:760px}
  .crow{display:flex; align-items:center; gap:22px; opacity:0; will-change:opacity}
  .crow .clab{font-family:var(--sans); font-size:30px; color:var(--gold); width:58px; text-align:right; flex:none}
  .crow .cbar{height:12px; border-radius:6px; background:linear-gradient(90deg, var(--gold-d), var(--gold-l)); width:0; box-shadow:0 0 20px rgba(200,169,81,.3)}
  .crow.hot .cbar{box-shadow:0 0 34px rgba(230,201,117,.7)}
  .cbracket{position:absolute; left:40px; top:0; bottom:0; width:40px; border:3px solid rgba(200,169,81,.4); border-right:none; border-radius:16px 0 0 16px; opacity:0}

  /* weave — OT/NT cross-reference web (two columns + connecting arcs) */
  .structwrap.big{top:296px; transform:none; align-items:flex-start}
  .weave{position:relative; width:900px; height:1320px}
  .weave .wvbloom{position:absolute; left:50%; top:50%; width:640px; height:640px; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(230,201,117,.32), transparent 62%); filter:blur(36px); opacity:0; pointer-events:none}
  .weave svg{position:absolute; inset:0; overflow:visible}
  .weave .wlab{position:absolute; white-space:nowrap; opacity:0; line-height:1}
  .weave .wlab.l{text-align:right}
  .weave .wname{display:block; font-family:var(--serif); font-size:30px; color:var(--cream); letter-spacing:.005em}
  .weave .wref{display:block; font-family:var(--sans); font-size:21px; margin-top:11px; letter-spacing:.11em; text-transform:uppercase; opacity:.9}
  .weave .wlab.l .wref{color:var(--gold-l)}
  .weave .wlab.r .wref{color:var(--sky)}
  .weave .colh{position:absolute; top:-56px; font-family:var(--sans); text-transform:uppercase; letter-spacing:.16em; font-weight:600; font-size:28px; color:var(--gold)}

  /* dials — physical constants with a razor-thin life-permitting band */
  .dials{display:flex; flex-direction:column; gap:82px; width:100%; max-width:780px}
  .dial{display:flex; align-items:center; gap:30px; opacity:0; will-change:opacity}
  .dial .dlab{font-family:var(--sans); text-transform:uppercase; letter-spacing:.1em; font-size:30px; color:var(--dim); width:320px; text-align:right; flex:none}
  .dial .dtrack{position:relative; flex:1; height:6px; border-radius:3px; background:rgba(120,140,170,.22)}
  .dial .dband{position:absolute; top:-7px; height:20px; border-radius:10px; background:var(--gold-l); box-shadow:0 0 30px rgba(230,201,117,.95); opacity:0}
  .dial .dpt{position:absolute; top:50%; width:10px; height:10px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); box-shadow:0 0 14px #fff; opacity:0}

  /* ---- dot-matrix grid + twin-count (particle-formed numbers) ---- */
  .structwrap.tc{top:286px; padding:0; align-items:flex-start}
  .tcfx{position:absolute; inset:0; width:1080px; height:1920px; pointer-events:none}   /* matrix + particle canvas (behind text) */
  .tcbox{position:relative; width:940px; height:1240px; margin:0 auto}
  .tccol{position:absolute; top:0; display:flex; flex-direction:column; align-items:center; opacity:0; will-change:opacity,transform}
  .tccol.l{left:20px; width:380px} .tccol.r{right:20px; width:380px}
  .tccol .tcar{font-family:var(--serif); font-size:68px; line-height:1}
  .tccol.l .tcar{color:var(--gold-l); text-shadow:0 0 34px rgba(200,169,81,.45)}
  .tccol.r .tcar{color:var(--sky); text-shadow:0 0 34px rgba(159,195,232,.45)}
  .tccol .tctr{font-family:var(--sans); text-transform:uppercase; letter-spacing:.2em; font-size:26px; margin-top:16px; color:var(--dim)}
  .tccol .tcen{font-family:var(--body); font-size:30px; margin-top:4px; color:var(--dim)}
  .tcnums{position:absolute; top:168px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:60px}
  .tcnum{font-family:var(--serif); font-weight:600; font-size:168px; line-height:1; opacity:0; will-change:opacity,transform,filter}
  .tcnum.l{color:var(--gold); text-shadow:0 0 72px rgba(200,169,81,.55)}
  .tcnum.r{color:var(--sky); text-shadow:0 0 72px rgba(159,195,232,.55)}
  .tceq{font-family:var(--serif); font-weight:600; font-size:100px; color:var(--cream); opacity:0; will-change:opacity,transform}
  .tcverse{position:absolute; top:392px; left:0; right:0; text-align:center; font-family:var(--body); font-style:italic; font-size:42px; color:var(--dim); opacity:0; padding:0 40px; line-height:1.2}
  .tccite{position:absolute; top:498px; left:0; right:0; text-align:center; font-family:var(--body); font-size:34px; color:var(--dim); opacity:0}

  /* ---- unit-chart grid (each dot = one unit; dots fill as the number counts up) ---- */
  .structwrap.grid{top:300px; padding:0; align-items:flex-start}
  .gridnum{position:absolute; top:24px; left:0; right:0; display:flex; flex-direction:column; align-items:center; opacity:0; will-change:opacity,transform}
  .gridnum .num{font-family:var(--serif); font-weight:600; font-size:168px; line-height:1; color:var(--gold); text-shadow:0 0 72px rgba(200,169,81,.55)}
  .gridnum.sky .num{color:var(--sky); text-shadow:0 0 72px rgba(159,195,232,.55)}
  .gridnum .lab2{font-family:var(--body); font-size:44px; color:var(--cream); margin-top:16px; text-align:center; max-width:820px}

  /* ---- name grid (dense roster + selective spotlight + running counter) ---- */
  .structwrap.ng{top:296px; padding:0; align-items:center; flex-direction:column}
  .nggrid{position:relative; width:980px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:center; gap:30px 20px}
  .ngcell{flex:0 0 156px; min-width:0; display:flex; flex-direction:column; align-items:center; opacity:0; will-change:opacity,filter}
  .ngcell .ngar{font-family:var(--serif); font-size:44px; line-height:1; color:var(--dim); white-space:nowrap}
  .ngcell .ngsub{font-family:var(--body); font-size:23px; margin-top:6px; color:var(--dim); opacity:.72; white-space:nowrap}
  .ngcell.hot .ngar{color:var(--gold-l); text-shadow:0 0 30px rgba(200,169,81,.65)}
  .ngcell.hot .ngsub{color:var(--gold-l); opacity:1}
  .ngcell.dim2{opacity:.3}
  .ngapart{position:relative; width:100%; margin:66px auto 0; display:flex; flex-direction:column; align-items:center; opacity:0}
  .ngapart .ngar{font-family:var(--serif); font-size:58px; color:var(--sky); text-shadow:0 0 30px rgba(159,195,232,.4)}
  .ngapart .ngsub{font-family:var(--sans); text-transform:uppercase; letter-spacing:.12em; font-size:26px; margin-top:12px; color:var(--dim)}
  .ngcounter{position:absolute; left:64px; top:150px; display:flex; flex-direction:column; align-items:flex-start; opacity:0}
  .ngcounter .ngclab{font-family:var(--sans); text-transform:uppercase; letter-spacing:.2em; font-size:26px; color:var(--dim)}
  .ngcounter .ngcnum{font-family:var(--serif); font-weight:600; font-size:112px; line-height:1; color:var(--gold); text-shadow:0 0 50px rgba(200,169,81,.5)}

  /* ---- timeline: a horizontal axis with points lighting up + a highlighted window ---- */
  .scene.tl-scene .beat{height:35%; padding-bottom:8px}
  .structwrap.tl-wrap{top:38%; padding:0; align-items:flex-start}
  .timeline{position:relative; width:820px; height:360px; margin:0 auto}
  .timeline .tl-axis{position:absolute; left:0; right:0; top:50%; height:3px; transform:translateY(-50%); opacity:0;
    background:linear-gradient(90deg, transparent, rgba(200,169,81,.65) 12%, rgba(200,169,81,.65) 88%, transparent)}
  .timeline .tl-band{position:absolute; top:50%; height:70px; transform:translateY(-50%); border-radius:12px;
    background:rgba(230,201,117,.16); border:1px solid rgba(230,201,117,.55); box-shadow:0 0 34px rgba(230,201,117,.25); opacity:0}
  .timeline .tl-band .tl-blab{position:absolute; left:50%; top:-54px; transform:translateX(-50%); white-space:nowrap;
    font-family:var(--sans); text-transform:uppercase; letter-spacing:.14em; font-size:26px; color:var(--gold-l)}

    font-family:var(--sans); letter-spacing:.08em; font-size:28px; color:var(--gold)}

  .timeline .tl-pt.below .tl-lab{top:34px}    .timeline .tl-pt.below .tl-yr{bottom:30px}

  /* ---- compare: two columns (expected vs claimed); diverging rows light gold ---- */

  .compare .cmp-row{font-family:var(--serif); font-size:48px; color:var(--dim); text-align:center; height:138px; display:flex; align-items:center; justify-content:center; line-height:1.12; opacity:0; will-change:opacity,transform}
  .compare .cmp-col.l .cmp-row{color:var(--cream)}
  .compare .cmp-col.r .cmp-row.diff{color:var(--gold-l); text-shadow:0 0 30px rgba(230,201,117,.55); font-weight:600}
  .compare .cmp-col.l .cmp-row.diff{color:var(--dim)}

  /* chiasm mirror: colour-paired twins (gold ↔ sky), centred bars form a diamond */
  .chiasm.mirror{align-items:center}
  .crow .cbar.sky{background:linear-gradient(90deg, rgba(159,195,232,.5), var(--sky))}
  .crow.hot .cbar.sky{box-shadow:0 0 34px rgba(159,195,232,.7)}

  /* footer matches tools/reel/gen_reel.py footer(): bold-SANS gold wordmark, serif dim url, muted-navy dots */
  .footer{position:absolute; left:0; right:0; bottom:120px; display:flex; flex-direction:column; align-items:center; gap:9px}
  .pager{display:flex; gap:15px; margin-bottom:18px}
  .pager .pd{width:13px; height:13px; border-radius:50%; background:#46546e}
  .footer .bn{font-family:var(--sans); font-weight:700; font-size:34px; letter-spacing:.28em; text-indent:.28em; text-transform:uppercase; color:var(--gold)}
  .footer .url{font-family:var(--body); font-weight:400; font-size:33px; letter-spacing:.02em; color:var(--dim)}

  #ui{position:absolute; left:50%; bottom:40px; transform:translateX(-50%); z-index:50; display:flex; gap:16px}
  #ui button{font-family:var(--sans); font-size:30px; color:var(--cream); background:rgba(200,169,81,.12);
    border:1px solid rgba(200,169,81,.5); border-radius:999px; padding:16px 34px; cursor:pointer}
  body.capture #ui{display:none}
</style>

  var SPEC = window.__SPEC || (function(){try{return JSON.parse(localStorage.getItem("__reelspec")||"null");}catch(e){return null;}})() || DEMO;
  var PLAIN = SPEC.bg==="plain";   // static colour background: no drifting dots/embers/sweep
  if(PLAIN){ [".aurora","#sky",".bloom",".sweep",".horizon"].forEach(function(q2){ var e=document.querySelector(q2); if(e) e.style.display="none"; }); }
  var scenesEl = document.getElementById("scenes");
  var model = [], pagerDots = [];
  function mk(cls, parent){ var e=document.createElement("div"); if(cls) e.className=cls; (parent||scenesEl).appendChild(e); return e; }

  function renderLine(ln, parent){
    if(ln.gap){ mk("gap", parent); return null; }
    if(ln.cite){ var c=mk("cite", parent); c.textContent=ln.t; return {el:c, words:[], chars:[]}; }
    var gold=(ln.c==="gold"), sweep=gold && ln.sweep;

    else if(ln.kinetic){ ln.t.split(" ").forEach(function(w,d){ var sp=document.createElement("span"); sp.className="w"; sp.textContent=w;

    else if(ln.parts){ ln.parts.forEach(function(p){ var sp=document.createElement("span"); if(p.c) sp.className=(p.c==="gold"?"g":"s"); sp.textContent=p.t; e.appendChild(sp); }); }
    else e.textContent=ln.t;

  function buildStructure(def, sceneEl){
    if(!def) return null;
    var wrap=mk("structwrap", sceneEl), s={type:def.type, items:[], el:wrap};
    if(def.type==="stats"){ var row=mk("stats", wrap);
      def.items.forEach(function(it){ var c=mk("stat", row); var n=mk("num",c); n.textContent=it.num; var l=mk("lab",c); l.textContent=it.label; s.items.push({el:c}); }); }
    else if(def.type==="bignum"){ var b=mk("bignum", wrap); var n=mk("num",b);

      var l=mk("lab",b); l.textContent=def.label||""; s.num=n; s.bnum=b; s.def=def; }
    else if(def.type==="list"){ s.variant=def.variant||null;
      if(def.variant==="acrostic") wrap.classList.add("acrostic-wrap");
      else if(def.variant==="checklist") wrap.classList.add("cl-wrap");
      else if(def.variant==="premises") wrap.classList.add("prem-wrap");
      else if(def.variant==="traits") wrap.classList.add("trait-wrap");
      var ls=mk("list "+(def.variant||"termlist"), wrap);
      def.rows.forEach(function(r){ var row=mk("lrow", ls); var a=null; if(r.label!=null){a=mk("llab",row); a.textContent=r.label;} var tx=mk("ltext",row); tx.textContent=r.t; s.items.push({el:row, lab:a, tx:tx}); }); }
    else if(def.type==="cone"){ var cvc=document.createElement("canvas"); cvc.width=1080; cvc.height=1920; cvc.className="tcfx";
      sceneEl.insertBefore(cvc, sceneEl.firstChild); s.ctx=cvc.getContext("2d"); s.def=def; }
    else if(def.type==="constellation"){ var cc=mk("constel", wrap);
      var svg=document.createElementNS(SVGNS,"svg"); svg.setAttribute("class","clines"); svg.setAttribute("viewBox","0 0 820 520"); cc.appendChild(svg); s.svg=svg;
      var n=def.items.length, pos=[];
      def.items.forEach(function(it,i){ var cx=90+i*(640/(n-1)), cy=(i%2===0)?150:360;  // zig-zag so labels never collide
        pos.push([cx,cy]); var nd=mk("node", cc); nd.style.left=cx+"px"; nd.style.top=cy+"px"; mk("dot",nd); var t=mk("nt",nd); t.textContent=it.t; if(it.sub){var su=mk("nsub",nd); su.textContent=it.sub;} s.items.push({el:nd}); });
      s.pos=pos; }
    else if(def.type==="chiasm"){ var ch=mk("chiasm"+(def.mirror?" mirror":""), wrap); if(def.bracket){ var br=document.createElement("div"); br.className="cbracket"; ch.appendChild(br); s.bracket=br; }
      def.rows.forEach(function(r){ var row=mk("crow", ch); var a=mk("clab",row); a.textContent=r.label||""; var bar=mk("cbar"+(r.c==="sky"?" sky":""),row); bar.dataset.len=r.len; s.items.push({el:row, bar:bar, len:r.len}); }); }
    else if(def.type==="dials"){ var dl=mk("dials", wrap);
      (def.items||[]).forEach(function(it){ var row=mk("dial", dl); var a=mk("dlab", row); a.textContent=it.label;
        var tr=mk("dtrack", row); var bw=it.band||0.02, pos=0.5;
        var band=mk("dband", tr); band.style.left=((pos-bw/2)*100)+"%"; band.style.width=(bw*100)+"%";
        var pt=mk("dpt", tr); pt.style.left=(pos*100)+"%";
        s.items.push({el:row, band:band, pt:pt}); }); }
    else if(def.type==="twincount"){ wrap.classList.add("tc");
      var cv=document.createElement("canvas"); cv.width=1080; cv.height=1920; cv.className="tcfx"; sceneEl.insertBefore(cv, sceneEl.firstChild);
      var box=mk("tcbox", wrap);
      function tcCol(side, d){ var c=mk("tccol "+side, box); var ar=mk("tcar", c); ar.textContent=d.ar||""; if(d.tr){var tr=mk("tctr", c); tr.textContent=d.tr;} if(d.en){var en=mk("tcen", c); en.textContent=d.en;} return c; }
      var lc=tcCol("l", def.left||{}), rc=tcCol("r", def.right||{});
      var nums=mk("tcnums", box);
      var ln=mk("tcnum l", nums); ln.textContent=(def.left&&def.left.num)||"";
      var eq=mk("tceq", nums); eq.textContent=def.eqsym||"=";
      var rn=mk("tcnum r", nums); rn.textContent=(def.right&&def.right.num)||"";
      var vs=null, ct=null;
      if(def.verse){ vs=mk("tcverse", box); vs.textContent=def.verse; }
      if(def.cite){ ct=mk("tccite", box); ct.textContent=def.cite; }
      s.cv=cv; s.ctx=cv.getContext("2d"); s.def=def; s.ln=ln; s.rn=rn; s.eq=eq; s.verse=vs; s.citeEl=ct; s.cols=[lc,rc]; }
    else if(def.type==="grid"){ wrap.classList.add("grid");

      s.cvg=cvg; s.ctx=cvg.getContext("2d"); s.def=def; s.numEl=nn; s.numWrap=gn; }
    else if(def.type==="namegrid"){ wrap.classList.add("ng");
      var cv2=document.createElement("canvas"); cv2.width=1080; cv2.height=1920; cv2.className="tcfx"; sceneEl.insertBefore(cv2, sceneEl.firstChild);
      var g=mk("nggrid", wrap);

      var apartEl=null;
      if(def.apart){ apartEl=mk("ngapart", wrap); var aar=mk("ngar",apartEl); aar.textContent=def.apart.t; if(def.apart.sub){var asu=mk("ngsub",apartEl); asu.textContent=def.apart.sub;} }
      var counter=mk("ngcounter", sceneEl); var cl=mk("ngclab",counter); cl.textContent=def.counterLabel||"By name"; var cn=mk("ngcnum",counter); cn.textContent="0";
      s.cv=cv2; s.ctx=cv2.getContext("2d"); s.def=def; s.apartEl=apartEl; s.cnum=cn; s.counterEl=counter; }
    else if(def.type==="compare"){ wrap.classList.add("cmp-wrap");
      var cmp=mk("compare", wrap); var lc=mk("cmp-col l", cmp), rc=mk("cmp-col r", cmp);
      var lh=mk("cmp-h", lc); lh.textContent=def.leftTitle||""; var rh=mk("cmp-h", rc); rh.textContent=def.rightTitle||"";
      s.heads=[lh, rh]; s.rows=[];
      (def.rows||[]).forEach(function(row){
        var le=mk("cmp-row"+(row.match?"":" diff"), lc); le.textContent=row.l;
        var re=mk("cmp-row"+(row.match?"":" diff"), rc); re.textContent=row.r;
        s.rows.push({l:le, r:re}); }); }
    else if(def.type==="timeline"){ wrap.classList.add("tl-wrap");
      var tl=mk("timeline", wrap); var axis=mk("tl-axis", tl); s.axis=axis;
      var from=def.from, to=def.to, span=(to-from)||1;
      function xp(y){ return ((y-from)/span)*100; }
      if(def.band){ var band=mk("tl-band", tl); band.style.left=xp(def.band.from)+"%"; band.style.width=Math.max(2,(xp(def.band.to)-xp(def.band.from)))+"%";
        if(def.band.label){ var bl=mk("tl-blab", band); bl.textContent=def.band.label; } s.band=band; }
      s.points=[];
      (def.points||[]).forEach(function(p,i){ var side=(p.side||(i%2?"below":"above"));
        var pt=mk("tl-pt "+side, tl); pt.style.left=xp(p.at)+"%";
        mk("tl-dot", pt); var lab=mk("tl-lab", pt); lab.textContent=p.label;
        if(def.showYears!==false){ var yr=mk("tl-yr", pt); yr.textContent=(def.unit||"AD")+" "+p.at; }
        s.points.push({el:pt}); }); }
    else if(def.type==="weave"){ wrap.classList.add("big"); var wv=mk("weave", wrap);
      var bloom=mk("wvbloom", wv); s.bloom=bloom;
      var svg=document.createElementNS(SVGNS,"svg"); svg.setAttribute("viewBox","0 0 900 1320"); wv.appendChild(svg); s.svg=svg;
      var defs=document.createElementNS(SVGNS,"defs");
      defs.innerHTML='<filter id="wvglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
      svg.appendChild(defs);
      var L=def.left||[], R=def.right||[], lx=236, rx=614, H2=1320, pad=22;
      var lh=mk("colh", wv); lh.textContent=def.leftTitle||"Old Testament"; lh.style.left="0px";
      var rh=mk("colh", wv); rh.textContent=def.rightTitle||"New Testament"; rh.style.right="0px";
      s.ly=[]; s.ry=[]; s.lnodes=[]; s.rnodes=[]; s.llabs=[]; s.rlabs=[];
      function wlab(name, side, y){ var e=mk("wlab "+side, wv);
        var obj=(typeof name==="object")?name:{t:name};
        var n=document.createElement("span"); n.className="wname"; n.textContent=obj.t; e.appendChild(n);
        if(obj.ref){ var r=document.createElement("span"); r.className="wref"; r.textContent=obj.ref; e.appendChild(r); }
        if(side==="l"){ e.style.left="0px"; e.style.width=(lx-40)+"px"; } else { e.style.left=(rx+40)+"px"; }
        e.style.top=(y-33)+"px"; e.style.opacity="0"; s.items.push({el:e}); return e; }
      function node(x,y,side){ var c=document.createElementNS(SVGNS,"circle"); c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r","6");
        c.setAttribute("fill", side==="l"?"#e6c975":"#9fc3e8"); c.setAttribute("filter","url(#wvglow)"); c.style.opacity="0"; svg.appendChild(c); return c; }
      L.forEach(function(name,i){ var y=pad+i*((H2-2*pad)/Math.max(1,L.length-1)); s.ly.push(y); s.llabs.push(wlab(name,"l",y)); s.lnodes.push(node(lx,y,"l")); });
      R.forEach(function(name,i){ var y=pad+i*((H2-2*pad)/Math.max(1,R.length-1)); s.ry.push(y); s.rlabs.push(wlab(name,"r",y)); s.rnodes.push(node(rx,y,"r")); });
      var links=def.links; if(!links){ links=[]; for(var ri=0; ri<Math.min(L.length,R.length); ri++) links.push([ri,ri]); }
      s.paths=[];
      links.forEach(function(lk,idx){ var y1=s.ly[lk[0]], y2=s.ry[lk[1]]; if(y1==null||y2==null) return;
        var cxm=(lx+rx)/2;
        var d="M"+lx+","+y1+" C"+cxm+","+y1+" "+cxm+","+y2+" "+rx+","+y2;
        var p=document.createElementNS(SVGNS,"path"); p.setAttribute("d",d); p.setAttribute("fill","none");
        p.setAttribute("stroke","rgba(200,169,81,0.30)"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round");
        svg.appendChild(p); var len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
        // bright travelling comet (a thread of light that runs OT -> NT) on EVERY thread
        var ov=document.createElementNS(SVGNS,"path"); ov.setAttribute("d",d); ov.setAttribute("fill","none");
        ov.setAttribute("stroke","#f1da94"); ov.setAttribute("stroke-width","3.4"); ov.setAttribute("stroke-linecap","round");
        ov.setAttribute("filter","url(#wvglow)");

        s.paths.push({el:p, ov:ov, len:len, ln:s.lnodes[lk[0]], rn:s.rnodes[lk[1]], ll:s.llabs[lk[0]], rl:s.rlabs[lk[1]]}); });
    }
    return s;
  }

  function build(){
    (SPEC.scenes||[]).forEach(function(sc){
      var el=mk("scene"); el.style.opacity=0;
      if(sc.stage==="arch"){ var d=mk("deco", el); d.innerHTML='<div class="arch"></div><div class="arch inner"></div><div class="pillar pL"></div><div class="pillar pR"></div><div class="mandala"></div>'; }
      var struct=buildStructure(sc.structure, el);
      if(sc.structure && sc.structure.type==="weave") el.classList.add("wv");
      if(sc.structure && sc.structure.variant==="acrostic") el.classList.add("acro");
      if(sc.structure && sc.structure.variant==="checklist") el.classList.add("clist");
      if(sc.structure && sc.structure.type==="timeline") el.classList.add("tl-scene");
      if(sc.structure && sc.structure.type==="compare") el.classList.add("cmp-scene");
      if(sc.structure && sc.structure.type==="cone") el.classList.add("cone-scene");
      if(sc.structure && sc.structure.variant==="premises") el.classList.add("prem");
      if(sc.structure && sc.structure.variant==="traits") el.classList.add("trait");
      var beats=sc.beats||[{center:true, lines:sc.lines, kicker:sc.kicker}];
      var bm=[];
      beats.forEach(function(b){
        var be=mk("beat"+(b.center?" center":""), el); be.style.opacity=0;
        var rec={el:be, lines:[], hi:b.hi||[], cur:(b.cur==null?-1:b.cur)};
        if(b.kicker){ var k=mk("kicker", be); k.textContent=b.kicker; }
        (b.lines||[]).forEach(function(ln){ var r=renderLine(ln, be); if(r) rec.lines.push(r); });
        bm.push(rec);
      });
      model.push({el:el, struct:struct, beats:bm});
    });
    var f=document.getElementById("footer");
    var parts=(SPEC.footer||"Apologia Daily · apologiadaily.com").split("·");
    f.querySelector(".bn").textContent=((parts[0]||"Apologia Daily").trim()).toUpperCase();
    f.querySelector(".url").textContent=(parts[1]||"apologiadaily.com").trim();
    var pager=document.getElementById("pager");
    for(var i=0;i<model.length;i++){ var pd=document.createElement("div"); pd.className="pd"; pager.appendChild(pd); }
    pagerDots=[].slice.call(pager.children);

      var done=Math.max(0, Math.min(seq.length, Math.floor((lt-start)/step)+(lt>=start?1:0)));
      for(var h=0; h<s.items.length; h++){ var cell=s.items[h].el; cell.classList.remove("hot");
        if(lt>start && seq.indexOf(h)<0) cell.classList.add("dim2"); else cell.classList.remove("dim2"); }
      for(var k2=0; k2<done; k2++){ if(s.items[seq[k2]]) s.items[seq[k2]].el.classList.add("hot"); }
      if(s.counterEl){ s.counterEl.style.opacity=ease((lt-start)/500); s.cnum.textContent=String(done); }
    } else if(s.type==="cone"){ drawCone(s.ctx, lt, s.def); }
  }

  function seek(t){
    if(!PLAIN){ drawField(t); var s=t/1000;
      q(".a1").style.transform="translate("+(Math.sin(s*0.33)*70)+"px,"+(Math.cos(s*0.3)*40)+"px) scale("+(1+Math.sin(s*0.33)*0.08)+")";
      q(".a2").style.transform="translate("+(Math.cos(s*0.27)*-60)+"px,"+(Math.sin(s*0.27)*50)+"px) scale("+(1.1+Math.cos(s*0.27)*0.1)+")";
      q(".a3").style.transform="translate("+(Math.sin(s*0.22)*50)+"px,"+(Math.cos(s*0.22)*-45)+"px)";
      q(".bloom").style.opacity=0.3+Math.abs(Math.sin(s*0.9))*0.32;
      q(".sweep").style.left=(-360+((t%11000)/11000)*1.9*W)+"px";
    }

    for(var si=0; si<model.length; si++){
      var m=model[si], sw=sceneWin(si), slt=t-sw.start, sop=fade(slt, sw.dur);
      m.el.style.opacity=sop; if(sop<=0) continue;
      var kb=1.005+0.055*clamp(slt/sw.dur); m.el.style.transform="scale("+kb+") translateY("+(-6*clamp(slt/sw.dur))+"px)";
      // beats
      var activeHi=[], activeCur=-1, bestOp=-1, activeBlt=slt;
      for(var bi=0; bi<m.beats.length; bi++){ var bw=beatWin(si,bi), blt=t-bw.start, bop=fade(blt, bw.dur);
        var be=m.beats[bi]; be.el.style.opacity=bop;
        if(bop>0){ for(var li=0; li<be.lines.length; li++) reveal(be.lines[li], blt, li); }
        if(bop>bestOp){ bestOp=bop; activeHi=be.hi; activeCur=be.cur; activeBlt=blt; } }
      if(m.struct) revealStruct(m.struct, slt, activeHi, activeCur, activeBlt);
    }
    var act=0, best=-1; for(var p=0;p<model.length;p++){ var o=parseFloat(model[p].el.style.opacity)||0; if(o>best){best=o;act=p;} }
    for(var d=0; d<pagerDots.length; d++) pagerDots[d].style.background=(d===act)?"var(--gold)":"#46546e";
  }
  var _c={}; function q(sel){ return _c[sel]||(_c[sel]=document.querySelector(sel)); }
  function total(){ var w=sceneWin(model.length-1); return w.start+w.dur; }

  window.__seek=seek; window.__total=total;
  window.__ready=(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){ build(); seedField(); seek(0); return {total:total()}; });

  if(!window.__CAPTURE){ window.__ready.then(function(){
    var synth=window.speechSynthesis, voice=null, raf, t0, flat=[];
    model.forEach(function(m,si){ (SPEC.scenes[si].beats||[{vo:SPEC.scenes[si].vo}]).forEach(function(b,bi){ flat.push({si:si,bi:bi,vo:b.vo}); }); });
    function pick(){ if(!synth) return; var vs=(synth.getVoices()||[]).filter(function(v){return /^en/i.test(v.lang);});
      var M=/\b(michael|david|mark|guy|eric|alex|george|daniel|james|ryan|male)\b/i, F=/\b(zira|hazel|susan|samantha|female)\b/i;
      voice=vs.slice().sort(function(a,b){var sa=(/US/i.test(a.lang)?4:/GB/i.test(a.lang)?2:1)+(M.test(a.name)?3:0)-(F.test(a.name)?5:0);var sb=(/US/i.test(b.lang)?4:/GB/i.test(b.lang)?2:1)+(M.test(b.name)?3:0)-(F.test(b.name)?5:0);return sb-sa;})[0]||vs[0]; }
    if(synth){ pick(); synth.onvoiceschanged=pick; }
    var spoke=-1;
    function loop(){ var t=performance.now()-t0; if(t>=total()){ seek(total()); if(synth)synth.cancel(); return; } seek(t);
      for(var i=0;i<flat.length;i++){ var bw=beatWin(flat[i].si,flat[i].bi); if(bw && t>=bw.start+250 && i>spoke){ spoke=i; if(synth&&flat[i].vo){ synth.cancel(); var u=new SpeechSynthesisUtterance(flat[i].vo); if(voice)u.voice=voice; u.rate=.95; synth.speak(u);} } }
      raf=requestAnimationFrame(loop); }
    document.getElementById("play").addEventListener("click", function(){ if(synth){try{synth.resume();}catch(e){}} cancelAnimationFrame(raf); if(synth)synth.cancel(); spoke=-1; t0=performance.now(); loop(); });
  }); }
})();
</script>
