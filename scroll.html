<!DOCTYPE html>
<!-- PROTOTYPE — "Scroll the Evidence" vertical pocket-card feed.
     Reads pocket-cards.json (generated from pocket-cards.html by
     tools/build-pocket-data.mjs). This is the feed SHELL only: no new card
     content, so no content-review gate is owed. The per-card objection hook
     line and the final framing copy are still to be written + gated before launch. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scroll the Evidence — Apologia Daily</title>
  <meta name="description" content="Swipe through the case for the faith, one answer at a time. The next time you meet an objection, you'll already have the answer." />
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root{
      --n:#050d1a; --n8:#0a1628; --n7:#0f2040; --n5:#1e4278; --n3:#4a7ab5;
      --g:#c8a951; --gl:#d4b96a; --gd:#a88930; --w:#fff;
      --fd:'Playfair Display',Georgia,serif;
      --ss:'Source Serif 4',Georgia,serif;
      --ui:'DM Sans',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;background:var(--n);}
    body{font-family:var(--ss);color:var(--w);-webkit-font-smoothing:antialiased;}
    /* one fixed background behind the whole feed, so a tall card that has to
       scroll keeps the starfield + glow instead of running onto black */
    body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:
        radial-gradient(ellipse 80% 55% at 50% 38%, rgba(200,169,81,0.13), transparent 60%),
        radial-gradient(ellipse 120% 80% at 50% 110%, rgba(30,66,120,0.35), transparent 55%),
        var(--n); }
    body::after{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,.35), transparent); }

    /* FEED — full-screen vertical scroll-snap, one card per screen */
    #feed{
      height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory;
      scroll-behavior:smooth; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    }
    #feed::-webkit-scrollbar{display:none;}

    .slide{
      height:100dvh; scroll-snap-align:start; scroll-snap-stop:always;
      display:flex; flex-direction:column;
      padding:calc(env(safe-area-inset-top,0px) + 3.6rem) 1.5rem max(1.6rem,env(safe-area-inset-bottom));
      position:relative; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .slide::-webkit-scrollbar{display:none;}
    /* margin:auto centres a short card, but collapses to 0 when the card is taller
       than the screen — so the whole card scrolls (top and bottom both reachable)
       instead of being clipped by the old overflow:hidden + justify-content:center */
    .card{ position:relative; z-index:1; max-width:560px; margin:auto; width:100%; }

    .eyebrow{
      font-family:var(--ui); font-size:.68rem; font-weight:600; letter-spacing:.2em;
      text-transform:uppercase; color:var(--g); margin-bottom:1rem;
      display:flex; align-items:center; gap:.6rem;
    }
    .eyebrow::before,.eyebrow::after{content:'';height:1px;width:22px;background:rgba(200,169,81,.45);}
    .eyebrow::after{flex:0 0 22px;} .eyebrow::before{flex:0 0 22px;}
    .card-title{
      font-family:var(--fd); font-weight:700; line-height:1.2;
      font-size:clamp(1.5rem,6vw,2rem); margin-bottom:.7rem;
    }
    .card-title em,.card-title .hl{color:var(--g);font-style:normal;}
    .card-tagline{
      font-family:var(--ss); font-style:italic; font-size:clamp(.92rem,3.6vw,1.05rem);
      line-height:1.55; color:rgba(255,255,255,.72); margin-bottom:1.25rem;
    }
    .points{list-style:none; margin-bottom:1.1rem;}
    .points li{
      font-family:var(--ss); font-size:clamp(.82rem,3.3vw,.92rem); line-height:1.5;
      color:rgba(255,255,255,.85); padding:.42rem 0; display:flex; gap:.6rem;
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .points li::before{content:'→'; color:var(--g); flex-shrink:0; font-family:var(--ui);}
    /* points flow at natural height; a tall card scrolls as one surface (the .slide) */
    .points-wrap{}
    .question{
      background:rgba(200,169,81,.1); border-left:3px solid var(--g);
      padding:.7rem .9rem; border-radius:0 4px 4px 0; margin-bottom:1.25rem;
      font-family:var(--ss); font-style:italic; font-size:clamp(.8rem,3.2vw,.9rem);
      line-height:1.55; color:rgba(255,255,255,.9);
    }
    .question b{font-family:var(--ui);font-style:normal;font-weight:600;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--g);display:block;margin-bottom:.3rem;}

    /* GO DEEPER — in-feed expandable answer (objection → concession → reply).
       Keeps the reader in the swipe; "See the evidence →" remains the full essay. */
    .deeper-toggle{
      font-family:var(--ui); font-size:.7rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
      color:var(--g); background:rgba(200,169,81,.08); border:1px solid rgba(200,169,81,.3);
      border-radius:3px; cursor:pointer; padding:.5rem .8rem; margin-bottom:1rem;
      display:flex; align-items:center; justify-content:space-between; width:100%; transition:background .15s;
    }
    .deeper-toggle:hover{background:rgba(200,169,81,.14);}
    .deeper-toggle .chev{font-size:.8rem; transition:transform .22s; margin-left:.5rem;}
    .deeper-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
    .deeper{
      max-height:0; opacity:0; overflow:hidden; margin-bottom:0;
      transition:max-height .28s ease, opacity .2s ease, margin-bottom .28s ease;
      border-left:3px solid rgba(200,169,81,.5); padding-left:0;
    }
    .deeper.open{ max-height:2000px; opacity:1; margin-bottom:1.1rem; padding-left:.9rem; }
    .deeper .dblk{margin:.5rem 0;}
    .deeper .dlabel{font-family:var(--ui); font-weight:600; font-size:.56rem; letter-spacing:.14em; text-transform:uppercase;
      color:var(--g); display:block; margin-bottom:.22rem;}
    .deeper .dtext{font-family:var(--ss); font-size:clamp(.82rem,3.2vw,.92rem); line-height:1.5; color:rgba(255,255,255,.86);}
    .deeper .dblk.answer .dlabel{color:var(--gl);}
    .deeper .dblk.answer .dtext{color:#fff;}

    .actions{display:flex;align-items:center;gap:.6rem;}
    .evidence-link{
      font-family:var(--ui); font-size:.82rem; font-weight:600; letter-spacing:.02em;
      color:var(--n); background:var(--g); text-decoration:none;
      padding:.6rem 1.1rem; border-radius:3px; transition:background .15s; flex:1; text-align:center;
    }
    .evidence-link:hover{background:var(--gl);}
    .icon-btn{
      width:42px;height:40px;flex:0 0 auto; border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.04); color:rgba(255,255,255,.8); border-radius:3px;
      cursor:pointer; font-size:1.05rem; display:flex; align-items:center; justify-content:center;
      transition:all .15s;
    }
    .icon-btn:hover{border-color:var(--g);color:var(--g);}
    .icon-btn.saved{color:var(--g);border-color:var(--g);background:rgba(200,169,81,.12);}

    /* progress rail */
    #rail{position:fixed; top:0; right:0; height:3px; z-index:50; background:var(--g); width:0; transition:width .2s;}
    /* brand + swipe cue */
    .topbar{position:fixed; top:0; left:0; right:0; z-index:40; display:flex; justify-content:space-between; align-items:center;
      padding:max(.9rem,env(safe-area-inset-top)) 1.2rem .7rem; pointer-events:none;
      background:linear-gradient(180deg,rgba(5,13,26,.75),transparent);}
    .brand{font-family:var(--fd); font-size:.95rem; font-weight:700; color:var(--w); pointer-events:auto; text-decoration:none;}
    .brand span{color:var(--g);}
    .counter{font-family:var(--ui); font-size:.72rem; color:rgba(255,255,255,.55);}
    /* in normal flow after the card so it can never overlap the card's own content */
    .swipe-cue{
      margin:1.5rem 0 .2rem; text-align:center; font-family:var(--ui); font-size:.7rem; letter-spacing:.14em;
      text-transform:uppercase; color:rgba(255,255,255,.4); animation:bob 1.8s ease-in-out infinite;
    }
    @keyframes bob{0%,100%{transform:translateY(0);opacity:.4;}50%{transform:translateY(5px);opacity:.75;}}

    /* TOPIC PICKER — tap-to-open sheet that filters the feed to one topic */
    .topics-btn{
      pointer-events:auto; font-family:var(--ui); font-size:.72rem; font-weight:600;
      letter-spacing:.04em; color:rgba(255,255,255,.85); background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:.35rem .7rem;
      cursor:pointer; display:flex; align-items:center; gap:.4rem; max-width:60vw;
      white-space:nowrap; overflow:hidden; transition:all .15s;
    }
    .topics-btn .label{overflow:hidden; text-overflow:ellipsis;}
    .topics-btn:hover{border-color:var(--g);color:var(--g);}
    .topics-btn.active{border-color:var(--g);color:var(--g);background:rgba(200,169,81,.12);}
    .topics-btn .tx{font-size:.82rem; flex:0 0 auto;}
    .topic-sheet{
      position:fixed; inset:0; z-index:60; display:none;
      background:rgba(5,13,26,.82); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
      flex-direction:column; justify-content:flex-end;
    }
    .topic-sheet.open{display:flex;}
    .topic-sheet-inner{
      background:var(--n8); border-top:1px solid rgba(200,169,81,.3);
      border-radius:16px 16px 0 0; padding:1.1rem 1.2rem max(1.4rem,env(safe-area-inset-bottom));
      max-height:80dvh; overflow-y:auto;
    }
    .topic-sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:.95rem;}
    .topic-sheet-title{font-family:var(--ui); font-size:.66rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--g);}
    .topic-sheet-close{background:none; border:none; color:rgba(255,255,255,.7); font-size:1.3rem; line-height:1; cursor:pointer; padding:.1rem .3rem;}
    .topic-chips{display:flex; flex-wrap:wrap; gap:.55rem;}
    .topic-chip{
      font-family:var(--ui); font-size:.82rem; color:rgba(255,255,255,.85);
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.18);
      border-radius:999px; padding:.5rem .95rem; cursor:pointer; transition:all .15s;
    }
    .topic-chip:hover{border-color:var(--g);color:var(--g);}
    .topic-chip.sel{background:var(--g);color:var(--n);border-color:var(--g);font-weight:600;}
    .sheet-streak{font-family:var(--ui); font-size:.68rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--g); margin:-.35rem 0 .9rem;}
    .saved-empty{text-align:center;}
    .saved-empty .actions{justify-content:center;}
    .saved-empty .evidence-link{flex:0 0 auto;}

    /* INTRO slide (the objection-frame hook) */
    .intro .eyebrow{justify-content:center;}
    .intro{text-align:center;}
    .intro .hook{font-family:var(--fd); font-weight:700; line-height:1.25; font-size:clamp(1.7rem,7vw,2.5rem); margin-bottom:1rem;}
    .intro .hook em{color:var(--g); font-style:italic;}
    .intro .sub{font-family:var(--ss); font-size:clamp(.95rem,3.8vw,1.1rem); line-height:1.6; color:rgba(255,255,255,.7); max-width:460px; margin:0 auto 1.6rem;}
    .intro .start{font-family:var(--ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);}
  </style>
</head>
<body>
  <div id="rail"></div>
  <div class="topbar">
    <a class="brand" href="/">Apologia<span>Daily</span></a>
    <button class="topics-btn" id="topicsBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span class="label">Topics</span><span class="tx">☰</span>
    </button>
  </div>
  <main id="feed" aria-label="Scroll the Evidence feed"></main>

  <!-- site analytics (PostHog via window.adTrack) + the Capacitor /api fetch shim -->
  <script src="/analytics.js" defer></script>
  <script>
  (function(){
    "use strict";
    var feed = document.getElementById('feed');
    var rail = document.getElementById('rail');

    // Safe wrapper — adTrack may be absent (analytics still loading / consent off).
    function track(name, props){ try { if (window.adTrack) window.adTrack(name, props||{}); } catch(e){} }

    // ---- per-viewer saves (localStorage; guarded, never load-bearing) ----
    function readSaved(){ try { return JSON.parse(localStorage.getItem('ad_saved_cards')||'[]'); } catch(e){ return []; } }
    function writeSaved(a){ try { localStorage.setItem('ad_saved_cards', JSON.stringify(a)); } catch(e){} }

    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

    // deterministic daily-ish shuffle so the order feels fresh but is stable within a day
    function dayShuffle(arr){
      var seed = Math.floor(Date.now()/864e5); // days since epoch
      var a = arr.slice();
      for (var i=a.length-1;i>0;i--){ seed=(seed*9301+49297)%233280; var j=Math.floor(seed/233280*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
      return a;
    }
    // a fresh random shuffle for each *subsequent* loop pass, so the endless feed
    // keeps feeling new instead of repeating the same daily order.
    function randShuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

    // ---- per-viewer day streak (localStorage; purely a light habit nudge) ----
    function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
    function bumpStreak(){
      try{
        var raw = JSON.parse(localStorage.getItem('ad_scroll_streak')||'null') || {last:null,count:0};
        var t = dayKey(new Date());
        if (raw.last !== t){
          var y=new Date(); y.setDate(y.getDate()-1);
          raw.count = (raw.last === dayKey(y)) ? (raw.count+1) : 1;
          raw.last = t;
          localStorage.setItem('ad_scroll_streak', JSON.stringify(raw));
        }
        return raw.count || 1;
      } catch(e){ return 0; }
    }

    // ---- #2 branded share image — redraws the card's EXISTING certified title +
    // tagline onto a navy/gold card (no new content), so a share is Story-ready. ----
    function wrapText(ctx, text, maxW){
      var words=(text||'').split(/\s+/), lines=[], line='';
      for (var i=0;i<words.length;i++){
        var test = line ? line+' '+words[i] : words[i];
        if (ctx.measureText(test).width > maxW && line){ lines.push(line); line=words[i]; }
        else line=test;
      }
      if (line) lines.push(line);
      return lines;
    }
    function renderShareCanvas(c){
      var W=1080, H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      var x=cv.getContext('2d'); var M=96;
      var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#071225'); g.addColorStop(1,'#030a16');
      x.fillStyle=g; x.fillRect(0,0,W,H);
      var rg=x.createRadialGradient(W/2,H*0.30,60,W/2,H*0.30,W*0.75);
      rg.addColorStop(0,'rgba(200,169,81,0.16)'); rg.addColorStop(1,'rgba(200,169,81,0)');
      x.fillStyle=rg; x.fillRect(0,0,W,H);
      x.textAlign='left';
      x.fillStyle='#c8a951'; x.font='600 30px "DM Sans",system-ui,sans-serif';
      x.fillText((c.categoryLabel||'').toUpperCase(), M, 232);
      x.strokeStyle='rgba(200,169,81,0.55)'; x.lineWidth=2; x.beginPath(); x.moveTo(M,256); x.lineTo(M+88,256); x.stroke();
      x.fillStyle='#fff'; x.font='700 76px "Playfair Display",Georgia,serif';
      var ty=362; wrapText(x,c.title,W-2*M).forEach(function(ln){ x.fillText(ln,M,ty); ty+=92; });
      x.fillStyle='rgba(255,255,255,0.80)'; x.font='italic 40px "Source Serif 4",Georgia,serif';
      var gy=ty+36; wrapText(x,c.tagline,W-2*M).forEach(function(ln){ x.fillText(ln,M,gy); gy+=56; });
      x.font='700 42px "Playfair Display",Georgia,serif'; x.fillStyle='#fff';
      x.fillText('Apologia', M, H-148);
      x.fillStyle='#c8a951'; x.fillText('Daily', M + x.measureText('Apologia').width, H-148);
      x.font='500 28px "DM Sans",system-ui,sans-serif'; x.fillStyle='rgba(255,255,255,0.62)';
      x.fillText('Scroll the Evidence · apologiadaily.com', M, H-102);
      return cv;
    }
    function shareCardImage(c, btn){
      var url='https://apologiadaily.com/'+c.essay;
      function linkFallback(){
        if (navigator.share){ navigator.share({title:'Apologia Daily — '+c.title, text:c.title, url:url}).catch(function(){}); }
        else if (navigator.clipboard){ navigator.clipboard.writeText(url); btn.textContent='✓'; setTimeout(function(){btn.textContent='↗';},1200); }
      }
      var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      ready.then(function(){
        var cv; try { cv=renderShareCanvas(c); } catch(e){ return linkFallback(); }
        if (!cv.toBlob) return linkFallback();
        cv.toBlob(function(blob){
          if (!blob) return linkFallback();
          var file=null; try { file=new File([blob],(c.id||'card')+'.png',{type:'image/png'}); } catch(e){}
          if (file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
            navigator.share({files:[file], title:'Apologia Daily — '+c.title, text:c.title+' — '+url}).catch(function(){});
          } else {
            var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(c.id||'card')+'.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function(){ try{URL.revokeObjectURL(a.href);}catch(e){} },4000);
            if (navigator.clipboard){ try{navigator.clipboard.writeText(url);}catch(e){} }
            btn.textContent='✓'; setTimeout(function(){btn.textContent='↗';},1400);
          }
        }, 'image/png');
      });
    }

    function introSlide(){
      var s = el('section','slide intro');
      var card = el('div','card');
      card.appendChild(el('div','eyebrow','Scroll the Evidence'));
      var h = el('div','hook');
      // framing copy = the already-validated reel hook; no new doctrinal claim
      h.appendChild(document.createTextNode('Saw an objection online? '));
      var em = el('em',null,"It's been asked before."); h.appendChild(em);
      card.appendChild(h);
      card.appendChild(el('p','sub','Swipe through the case for the faith, one answer at a time — so the next time you meet a hard question, you already have the answer.'));
      card.appendChild(el('div','start','Swipe up to begin ↑'));
      s.appendChild(card);
      return s;
    }

    function cardSlide(c, saved, pos){
      var s = el('section','slide');
      s.dataset.cardId = c.id; s.dataset.cat = c.category; s.dataset.pos = pos;
      var card = el('div','card');
      card.appendChild(el('div','eyebrow', c.categoryLabel));
      card.appendChild(el('h2','card-title', c.title));
      card.appendChild(el('p','card-tagline', c.tagline));

      var pw = el('div','points-wrap');
      var ul = el('ul','points');
      (c.points||[]).forEach(function(p){ ul.appendChild(el('li',null,p)); });
      pw.appendChild(ul); card.appendChild(pw);

      // GO DEEPER — in-feed expand (only when the card has gated deeper content)
      var d = c.deeper;
      if (d && (d.objection || d.concession || d.reply)){
        var dBtn = el('button','deeper-toggle'); dBtn.type='button';
        dBtn.setAttribute('aria-expanded','false');
        dBtn.appendChild(document.createTextNode('Go deeper'));
        dBtn.appendChild(el('span','chev','▾'));

        var panel = el('div','deeper'); panel.setAttribute('aria-hidden','true');
        var pid = 'deeper-' + c.id; panel.id = pid;
        dBtn.setAttribute('aria-controls', pid);
        function dblk(label, text, extra){
          if (!text) return;
          var b = el('div','dblk' + (extra ? ' ' + extra : ''));
          b.appendChild(el('span','dlabel', label));
          b.appendChild(el('p','dtext', text));
          panel.appendChild(b);
        }
        dblk('The objection', d.objection);
        dblk("What's fair to grant", d.concession);
        dblk('The answer', d.reply, 'answer');

        dBtn.addEventListener('click', function(){
          var open = panel.classList.toggle('open');
          dBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
          panel.setAttribute('aria-hidden', open ? 'false' : 'true');
          if (open) track('scroll_card_deeper_opened', {card:c.id, category:c.category});
        });
        card.appendChild(dBtn);
        card.appendChild(panel);
      }

      if (c.question){
        var q = el('div','question');
        q.appendChild(el('b',null,'In conversation'));
        q.appendChild(document.createTextNode(c.question));
        card.appendChild(q);
      }

      var actions = el('div','actions');
      var link = el('a','evidence-link','See the evidence →');
      link.href = '/' + c.essay;
      link.addEventListener('click', function(){ track('scroll_evidence_clicked', {card:c.id, category:c.category}); });
      actions.appendChild(link);

      var save = el('button','icon-btn' + (saved.indexOf(c.id)>-1?' saved':''));
      save.type='button'; save.title='Save'; save.setAttribute('aria-label','Save this card');
      save.textContent = saved.indexOf(c.id)>-1 ? '★' : '☆';
      save.addEventListener('click', function(){
        var arr = readSaved(); var i = arr.indexOf(c.id);
        if (i>-1){ arr.splice(i,1); save.classList.remove('saved'); save.textContent='☆'; }
        else { arr.push(c.id); save.classList.add('saved'); save.textContent='★'; track('scroll_card_saved', {card:c.id, category:c.category}); }
        writeSaved(arr);
      });
      actions.appendChild(save);

      var share = el('button','icon-btn'); share.type='button'; share.title='Share'; share.setAttribute('aria-label','Share this card');
      share.textContent='↗';
      share.addEventListener('click', function(){
        track('scroll_card_shared', {card:c.id, category:c.category});
        shareCardImage(c, share);
      });
      actions.appendChild(share);
      card.appendChild(actions);
      s.appendChild(card);

      var cue = el('div','swipe-cue','Swipe for the next ↑');
      s.appendChild(cue);
      return s;
    }

    function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

    var ALL = [];            // every card, as loaded
    var CATS = [];           // [{cat,label}] in authored order
    var currentCat = null;   // null = All topics; '__saved__' = saved view
    var io = null, ioSeen = {};
    var posCounter = 0;      // running position across appended loop passes
    var loopOn = false;      // only the mixed (all-topics) feed loops endlessly
    var streakCount = 0;

    // per-card reach / depth: fire once (per id) when a card is ≥60% on screen.
    function makeIO(){
      if (!('IntersectionObserver' in window)) { io=null; return; }
      if (io) io.disconnect();
      ioSeen = {};
      io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          var id = en.target.dataset.cardId;
          if (en.isIntersecting && en.intersectionRatio >= 0.6 && id && !ioSeen[id]){
            ioSeen[id] = 1;
            track('scroll_card_viewed', {card:id, category:en.target.dataset.cat, position:+en.target.dataset.pos});
          }
        });
      }, {root: feed, threshold: 0.6});
    }
    function observeSlides(nodes){ if (io) nodes.forEach(function(s){ if (s.dataset && s.dataset.cardId) io.observe(s); }); }

    function savedEmptySlide(){
      var s=el('section','slide'); var card=el('div','card saved-empty');
      card.appendChild(el('div','eyebrow','Saved'));
      card.appendChild(el('h2','card-title','Nothing saved yet'));
      card.appendChild(el('p','card-tagline','Tap the ☆ on any card to keep it here — your saved cards live on this device.'));
      var a=el('button','evidence-link','Browse all topics'); a.type='button';
      a.addEventListener('click', function(){ setTopic(null); });
      var act=el('div','actions'); act.appendChild(a); card.appendChild(act);
      s.appendChild(card); return s;
    }

    // Append one more pass of cards (mixed feed only) so it never dead-ends at 77.
    // First pass = the daily order; later passes = a fresh random shuffle.
    function appendPass(){
      var saved = readSaved();
      var list = (posCounter===0 ? dayShuffle(ALL) : randShuffle(ALL));
      var frag = document.createDocumentFragment(), added=[];
      list.forEach(function(c){ posCounter++; var sl=cardSlide(c, saved, posCounter); frag.appendChild(sl); added.push(sl); });
      feed.appendChild(frag);
      observeSlides(added);
      pruneTop();
    }
    // keep the DOM bounded during the endless loop: drop slides fully scrolled past.
    function pruneTop(){
      var WINDOW = ALL.length*2 + 4;
      while (feed.children.length > WINDOW){
        var first = feed.firstChild; var h = first.offsetHeight||0;
        if (feed.scrollTop <= h + 8) break;   // never remove what we're on/near
        feed.removeChild(first); feed.scrollTop -= h;
      }
    }

    // (Re)build the feed. cat===null → intro + endlessly-looping day-shuffled mix;
    // a category → just that topic (finite); '__saved__' → saved cards (finite).
    function buildSlides(cat){
      var saved = readSaved();
      clear(feed); posCounter = 0; makeIO();
      if (cat === '__saved__'){
        loopOn = false;
        var ls = ALL.filter(function(c){ return saved.indexOf(c.id)>-1; });
        if (!ls.length){ feed.appendChild(savedEmptySlide()); }
        else { var as=[]; ls.forEach(function(c,i){ var sl=cardSlide(c,saved,i+1); feed.appendChild(sl); as.push(sl); }); observeSlides(as); }
      } else if (cat){
        loopOn = false;
        var lt = ALL.filter(function(c){ return c.category===cat; }), at=[];
        lt.forEach(function(c,i){ var sl=cardSlide(c,saved,i+1); feed.appendChild(sl); at.push(sl); });
        observeSlides(at);
      } else {
        loopOn = true;
        feed.appendChild(introSlide());
        appendPass();   // first pass (daily order), observed; prune is a no-op here
      }
      feed.scrollTop = 0; rail.style.width = '0%';
    }

    function setTopic(cat){
      currentCat = cat;
      var btn = document.getElementById('topicsBtn');
      var found = cat ? CATS.filter(function(x){ return x.cat===cat; })[0] : null;
      btn.querySelector('.label').textContent = cat==='__saved__' ? '★ Saved' : (found ? found.label : 'Topics');
      btn.classList.toggle('active', !!cat);
      buildSlides(cat);
      track('scroll_topic_selected', {category: cat || 'all'});
    }

    // the tap-to-open topic sheet — built in JS so chips stay data-driven (textContent)
    function buildTopicUI(){
      var btn = document.getElementById('topicsBtn');
      var entries = [{cat:null, label:'All topics'}, {cat:'__saved__', label:'★ Saved'}].concat(CATS);

      var sheet = el('div','topic-sheet'); sheet.id='topicSheet';
      sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true'); sheet.setAttribute('aria-label','Choose a topic');
      var inner = el('div','topic-sheet-inner');
      var head = el('div','topic-sheet-head');
      head.appendChild(el('div','topic-sheet-title','Jump to a topic'));
      var closeBtn = el('button','topic-sheet-close'); closeBtn.type='button'; closeBtn.setAttribute('aria-label','Close'); closeBtn.textContent='✕';
      head.appendChild(closeBtn); inner.appendChild(head);

      if (streakCount > 0){
        inner.appendChild(el('div','sheet-streak',
          streakCount === 1 ? 'Day 1 — come back tomorrow to start a streak' : (streakCount + '-day streak')));
      }

      var chips = el('div','topic-chips');
      entries.forEach(function(e){
        var chip = el('button','topic-chip', e.label); chip.type='button';
        chip.addEventListener('click', function(){ setTopic(e.cat); closeSheet(); });
        chips.appendChild(chip);
      });
      inner.appendChild(chips); sheet.appendChild(inner);
      document.body.appendChild(sheet);

      function openSheet(){
        chips.querySelectorAll('.topic-chip').forEach(function(ch, idx){
          ch.classList.toggle('sel', (entries[idx].cat || null) === currentCat);
        });
        sheet.classList.add('open'); btn.setAttribute('aria-expanded','true');
        track('scroll_topics_opened', {});
      }
      function closeSheet(){ sheet.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }

      btn.addEventListener('click', function(){ sheet.classList.contains('open') ? closeSheet() : openSheet(); });
      closeBtn.addEventListener('click', closeSheet);
      sheet.addEventListener('click', function(e){ if (e.target === sheet) closeSheet(); }); // backdrop tap
      document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
    }

    function render(cards){
      ALL = cards;
      streakCount = bumpStreak();
      var seenCat = {};
      cards.forEach(function(c){ if (!seenCat[c.category]){ seenCat[c.category]=1; CATS.push({cat:c.category, label:c.categoryLabel}); } });
      buildTopicUI();
      buildSlides(null);
      track('scroll_feed_opened', {total: cards.length});
      // progress rail — attached once; reads the live feed on every scroll.
      // Still no "n / N" counter: it would advertise a finite end and cap the endless feel.
      feed.addEventListener('scroll', function(){
        var max = feed.scrollHeight - feed.clientHeight;
        rail.style.width = (max>0 ? (feed.scrollTop/max*100) : 0) + '%';
        // #4 endless loop (mixed feed only): extend before the reader hits the end
        if (loopOn && (feed.scrollHeight - (feed.scrollTop + feed.clientHeight) < feed.clientHeight*2)){ appendPass(); }
      }, {passive:true});
    }

    // keyboard nav
    document.addEventListener('keydown', function(e){
      if (e.key==='ArrowDown'||e.key===' '){ feed.scrollBy({top:feed.clientHeight,behavior:'smooth'}); e.preventDefault(); }
      else if (e.key==='ArrowUp'){ feed.scrollBy({top:-feed.clientHeight,behavior:'smooth'}); e.preventDefault(); }
    });

    fetch('pocket-cards.json', {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d.cards||[]); })
      .catch(function(err){
        feed.innerHTML = '<section class="slide"><div class="card" style="text-align:center">'
          + '<div class="eyebrow" style="justify-content:center">Scroll the Evidence</div>'
          + '<p class="card-tagline">Could not load the deck ('+err+').<br>Run <code>node tools/build-pocket-data.mjs</code> and reload.</p>'
          + '</div></section>';
      });
  })();
  </script>
</body>
</html>
